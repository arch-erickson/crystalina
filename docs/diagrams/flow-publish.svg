  <rect width="1380" height="665.08" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Staff changing what a visitor sees</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Editing is local until someone presses Publish to website. That is deliberate: a manager can work through changes without a half-finished page going live.</text><text x="1348" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-09</text><text x="1348" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="94.68" x2="1348" y2="94.68" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="1293.77" y="108.68" width="56.23" height="18" rx="9" fill="#FDF0D5" stroke="#F2D08C" stroke-width="1" /><text x="1321.88" y="121.05" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#8A5207" text-anchor="middle" letter-spacing="0.1">Partial</text><rect x="66" y="140.68" width="297" height="52" rx="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="1" /><use href="#i-gear" x="140.34" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="224.5" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Admin browser</text><text x="214.5" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/admin/</text><line x1="214.5" y1="192.68" x2="214.5" y2="458.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="383" y="140.68" width="297" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-database" x="476.25" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="541.5" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Postgres</text><text x="531.5" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">security definer RPCs</text><line x1="531.5" y1="192.68" x2="531.5" y2="458.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="700" y="140.68" width="297" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-image" x="797.03" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="858.5" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Storage</text><text x="848.5" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">site-media</text><line x1="848.5" y1="192.68" x2="848.5" y2="458.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="1017" y="140.68" width="297" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-globe" x="1102.69" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1175.5" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Storefront</text><text x="1165.5" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/ and /shop/</text><line x1="1165.5" y1="192.68" x2="1165.5" y2="458.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><line x1="214.5" y1="253.68" x2="528.5" y2="253.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="373" y="243.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">1. upsert_product(...) with the staff JWT</text><path d="M 531.5 282.68 L 521.5 282.68 L 521.5 298.68 L 531.5 298.68" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="545.5" y="276.68" width="602.3" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="555.5" y="292.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">2. private.has_role(admin or manager), or refuse</text><line x1="214.5" y1="327.68" x2="845.5" y2="327.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="531.5" y="317.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3. upload an image to site-media</text><line x1="214.5" y1="361.68" x2="528.5" y2="361.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="373" y="351.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">4. Publish to website writes site_content</text><line x1="1165.5" y1="395.68" x2="534.5" y2="395.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="848.5" y="385.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">5. next visitor hydrates from site_content and products</text><line x1="1165.5" y1="429.68" x2="851.5" y2="429.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="1007" y="419.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">6. images by public URL</text><rect x="56" y="492.68" width="1268" height="128.4" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><use href="#i-alert" x="72" y="502.68" width="16" height="16" color="#DC2F4B" /><text x="94" y="512.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="72" y="534.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Anonymous or customer caller: the function refuses. Checked 2026-08-31.</text><text x="72" y="555.28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Delete a product that is on an order: refused, so order history cannot be orphaned.</text><text x="72" y="575.88" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Staff text reaches another staff member through innerHTML unescaped. That is a stored XSS route and it is open today.</text><text x="72" y="596.48" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">No cache busting on the published payload yet, so a returning visitor can hold a stale section for one load.</text>
</svg>
