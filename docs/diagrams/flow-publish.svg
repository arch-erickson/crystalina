  <rect width="860" height="842.35" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Staff changing what a visitor sees</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Editing is local until someone presses Publish to website. That is deliberate: a</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">manager can work through changes without a half-finished page going live.</text><text x="828" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-11</text><text x="828" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="111.35" x2="828" y2="111.35" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="764" y="127.35" width="62" height="18" rx="9" fill="#FDF0D5" stroke="#C2680C" stroke-opacity=".45"/><text x="795" y="140.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#8A5207">Partial</text><g transform="translate(0 165.35)"><path d="M122 62 V428" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="37" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="33" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="33" y="0" width="5" height="62" rx="2" fill="#8B5CF6"/><use href="#i-gear" x="45" y="17" width="28" height="28" color="#8B5CF6" /><text x="79" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Admin browser</text><text x="79" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#6D4CB0" text-anchor="start">/admin/</text><path d="M318 62 V428" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="233" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="229" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="229" y="0" width="5" height="62" rx="2" fill="#14B8A6"/><use href="#i-database" x="241" y="17" width="28" height="28" color="#14B8A6" /><text x="275" y="21.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Postgres</text><text x="275" y="36.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">security definer</text><text x="275" y="49.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">RPCs</text><path d="M514 62 V428" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="429" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="425" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="425" y="0" width="5" height="62" rx="2" fill="#14B8A6"/><use href="#i-image" x="437" y="17" width="28" height="28" color="#14B8A6" /><text x="471" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Storage</text><text x="471" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">site-media</text><path d="M710 62 V428" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="625" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="621" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="621" y="0" width="5" height="62" rx="2" fill="#3B82F6"/><use href="#i-globe" x="633" y="17" width="28" height="28" color="#3B82F6" /><text x="667" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Storefront</text><text x="667" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#2F6CAE" text-anchor="start">/ and /shop/</text><path d="M136 144 H314" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-violet)"/><circle cx="122" cy="144" r="9" fill="#8B5CF6"/><text x="122" y="147.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M322 170 H352 Q360 170 360 178 V188 Q360 196 352 196 H326" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-teal)"/><circle cx="304" cy="170" r="9" fill="#14B8A6"/><text x="304" y="173.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M136 240 H510" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-violet)"/><circle cx="122" cy="240" r="9" fill="#8B5CF6"/><text x="122" y="243.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M136 302 H314" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-violet)"/><circle cx="122" cy="302" r="9" fill="#8B5CF6"/><text x="122" y="305.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M696 350 H322" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="710" cy="350" r="9" fill="#3B82F6"/><text x="710" y="353.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M696 398 H518" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="710" cy="398" r="9" fill="#3B82F6"/><text x="710" y="401.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="220" y="118" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">upsert_product(...) with</text><text x="220" y="132" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">the staff JWT</text><text x="370" y="179" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">private.has_role(admin or manager), or refuse</text><text x="318" y="228" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">upload an image to site-media</text><text x="220" y="276" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">Publish to website</text><text x="220" y="290" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">writes site_content</text><text x="514" y="338" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">next visitor hydrates from site_content and products</text><text x="612" y="386" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">images by public URL</text></g><rect x="34" y="639.35" width="792" height="163" rx="10" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><rect x="34" y="639.35" width="4.5" height="163" rx="2" fill="#DC2F4B" stroke="none" stroke-width="1" /><use href="#i-alert" x="52" y="653.35" width="17" height="17" color="#DC2F4B" /><text x="77" y="666.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="52" y="689.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Anonymous or customer caller: the function refuses. Checked 2026-08-31.</text><text x="52" y="710.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Delete a product that is on an order: refused, so order history cannot be orphaned.</text><text x="52" y="732.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Staff text reaches another staff member through innerHTML unescaped. That is a stored XSS route and it is</text><text x="52" y="747.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">open today.</text><text x="52" y="769.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">No cache busting on the published payload yet, so a returning visitor can hold a stale section for one</text><text x="52" y="784.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">load.</text>
</svg>
