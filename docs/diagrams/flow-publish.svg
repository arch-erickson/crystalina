<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 665.08" width="1380" height="665.08" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Staff changing what a visitor sees</title>
  <desc id="diagram-desc">Editing is local until someone presses Publish to website. That is deliberate: a manager can work through changes without a half-finished page going live.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
