<text x="79" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#2F6CAE" text-anchor="start">/checkout/</text><path d="M318 62 V578" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="233" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="229" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="229" y="0" width="5" height="62" rx="2" fill="#E29A12"/><use href="#i-bolt" x="241" y="17" width="28" height="28" color="#E29A12" /><text x="275" y="21.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Server boundary</text><text x="275" y="36.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#9A6214" text-anchor="start">POST</text><text x="275" y="49.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#9A6214" text-anchor="start">/api/orders/create</text><path d="M514 62 V578" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="429" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="425" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="425" y="0" width="5" height="62" rx="2" fill="#E0455F"/><use href="#i-shield" x="437" y="17" width="28" height="28" color="#E0455F" /><text x="471" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Turnstile</text><text x="471" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#B23347" text-anchor="start">siteverify</text><path d="M710 62 V578" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="625" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="621" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="621" y="0" width="5" height="62" rx="2" fill="#14B8A6"/><use href="#i-database" x="633" y="17" width="28" height="28" color="#14B8A6" /><text x="667" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Postgres</text><text x="667" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">create_order()</text><path d="M906 62 V578" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="821" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="817" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="817" y="0" width="5" height="62" rx="2" fill="#3B82F6"/><use href="#i-mail" x="829" y="17" width="28" height="28" color="#3B82F6" /><text x="863" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Resend</text><text x="863" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#2F6CAE" text-anchor="start">confirmation</text><path d="M136 158 H314" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="158" r="9" fill="#3B82F6"/><text x="122" y="161.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M322 184 H352 Q360 184 360 192 V202 Q360 210 352 210 H326" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="304" cy="184" r="9" fill="#E29A12"/><text x="304" y="187.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M332 256 H510" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="318" cy="256" r="9" fill="#E29A12"/><text x="318" y="259.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M322 282 H352 Q360 282 360 290 V300 Q360 308 352 308 H326" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="304" cy="282" r="9" fill="#E29A12"/><text x="304" y="285.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M332 354 H706" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="318" cy="354" r="9" fill="#E29A12"/><text x="318" y="357.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M714 380 H744 Q752 380 752 388 V398 Q752 406 744 406 H718" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-teal)"/><circle cx="696" cy="380" r="9" fill="#14B8A6"/><text x="696" y="383.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M696 452 H322" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-teal)" stroke-dasharray="6 5"/><circle cx="710" cy="452" r="9" fill="#14B8A6"/><text x="710" y="455.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><path d="M332 500 H902" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="318" cy="500" r="9" fill="#E29A12"/><text x="318" y="503.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><path d="M304 548 H126" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)" stroke-dasharray="6 5"/><circle cx="318" cy="548" r="9" fill="#E29A12"/><text x="318" y="551.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="220" y="118" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">ids, quantities,</text><text x="220" y="132" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">address, token. No</text><text x="220" y="146" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">prices</text><text x="370" y="193" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">method guard, 10 per 10 minutes per IP, body</text><text x="370" y="207" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">capped at 64KB</text><text x="416" y="244" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">verify token</text><text x="370" y="291" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">JWT to user, UUIDs checked, max 50 lines,</text><text x="370" y="305" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">quantity 1 to 99</text><text x="514" y="342" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">create_order(items, address) as the signed-in user</text><text x="762" y="389" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">reprice every line, check stock, decrement,</text><text x="762" y="403" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">insert order: one transaction</text><text x="514" y="440" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">order id and total</text><text x="612" y="488" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">confirmation email</text><text x="220" y="536" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">201 and the order id</text></g><rect x="34" y="789.35" width="960" height="153.5" rx="10" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><rect x="34" y="789.35" width="4.5" height="153.5" rx="2" fill="#DC2F4B" stroke="none" stroke-width="1" /><use href="#i-alert" x="52" y="803.35" width="17" height="17" color="#DC2F4B" /><text x="77" y="816.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="52" y="839.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">No session: 401 before anything is read.</text><text x="52" y="860.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Bad or missing captcha token: 400, nothing written.</text><text x="52" y="882.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Out of stock: create_order raises, the transaction rolls back, no partial order.</text><text x="52" y="903.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Resend unavailable or key unset: the order stands and the email is skipped. Email never gates the order.</text><text x="52" y="925.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Today, in production: no environment variables, so the function cannot reach Supabase and returns 500.</text>
</svg>
