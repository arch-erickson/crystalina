<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 813.68" width="1380" height="813.68" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Placing an order, as it works today</title>
  <desc id="diagram-desc">Server-authoritative and atomic, and deliberately unreachable: nothing takes money yet, so the submit button in /checkout/ is disabled.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
  <defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1D6FE0" /></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#C2680C" /></marker><marker id="m-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7C3AED" /></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#0D9488" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#0E9F6E" /></marker><marker id="m-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#DC2F4B" /></marker><marker id="m-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#64748B" /></marker><marker id="m-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#15375D" /></marker></defs>
  <defs><symbol id="i-alert" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 29.5 27.5h-27z" fill="currentColor" fill-opacity=".2"/><path d="M16 4 29.5 27.5h-27z"/><path d="M16 13v6M16 23.2h.01"/></g></symbol><symbol id="i-bolt" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 3 7 17.5h7.5L13.5 29 25 14.5h-7.5z" fill="currentColor" fill-opacity=".2"/><path d="M18.5 3 7 17.5h7.5L13.5 29 25 14.5h-7.5z"/></g></symbol><symbol id="i-browser" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="22" rx="3.5" fill="currentColor" fill-opacity=".16"/><rect x="3" y="5" width="26" height="22" rx="3.5"/><path d="M3 12h26"/><path d="M7 8.5h.01M11 8.5h.01M15 8.5h.01"/></g></symbol><symbol id="i-database" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8" fill="currentColor" fill-opacity=".22"/><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8"/><path d="M5.5 7.5v17c0 2.1 4.7 3.8 10.5 3.8s10.5-1.7 10.5-3.8v-17"/><path d="M5.5 16c0 2.1 4.7 3.8 10.5 3.8S26.5 18.1 26.5 16"/></g></symbol><symbol id="i-mail" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="25" height="18" rx="3" fill="currentColor" fill-opacity=".16"/><rect x="3.5" y="7" width="25" height="18" rx="3"/><path d="M4 8.5 16 17.5 28 8.5"/></g></symbol><symbol id="i-shield" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3.5 27 8v7.4c0 6.4-4.5 10.8-11 12.6-6.5-1.8-11-6.2-11-12.6V8z" fill="currentColor" fill-opacity=".18"/><path d="M16 3.5 27 8v7.4c0 6.4-4.5 10.8-11 12.6-6.5-1.8-11-6.2-11-12.6V8z"/><path d="M11.5 15.8 15 19.3l6-6.3"/></g></symbol></defs>
  <rect width="1380" height="813.68" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Placing an order, as it works today</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Server-authoritative and atomic, and deliberately unreachable: nothing takes money yet, so the submit button in /checkout/ is disabled.</text><text x="1348" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-09</text><text x="1348" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="94.68" x2="1348" y2="94.68" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="1293.77" y="108.68" width="56.23" height="18" rx="9" fill="#FDF0D5" stroke="#F2D08C" stroke-width="1" /><text x="1321.88" y="121.05" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#8A5207" text-anchor="middle" letter-spacing="0.1">Partial</text><rect x="66" y="140.68" width="233.6" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-browser" x="131.33" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="192.8" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Browser</text><text x="182.8" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/checkout/</text><line x1="182.8" y1="192.68" x2="182.8" y2="586.67" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="319.6" y="140.68" width="233.6" height="52" rx="10" fill="#C2680C" stroke="#C2680C" stroke-width="1" /><use href="#i-bolt" x="354.68" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="446.4" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Server boundary</text><text x="436.4" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">POST /api/orders/create</text><line x1="436.4" y1="192.68" x2="436.4" y2="586.67" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="573.2" y="140.68" width="233.6" height="52" rx="10" fill="#DC2F4B" stroke="#DC2F4B" stroke-width="1" /><use href="#i-shield" x="630.97" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="700" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Turnstile</text><text x="690" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">siteverify</text><line x1="690" y1="192.68" x2="690" y2="586.67" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="826.8" y="140.68" width="233.6" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-database" x="888.35" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="953.6" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Postgres</text><text x="943.6" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">create_order()</text><line x1="943.6" y1="192.68" x2="943.6" y2="586.67" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="1080.4" y="140.68" width="233.6" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-mail" x="1149.51" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1207.2" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Resend</text><text x="1197.2" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">confirmation</text><line x1="1197.2" y1="192.68" x2="1197.2" y2="586.67" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><line x1="182.8" y1="260.68" x2="433.4" y2="260.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="309.6" y="237.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">1. ids, quantities, address, token.</text><text x="309.6" y="250.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">No prices</text><path d="M 436.4 296.68 L 426.4 296.68 L 426.4 312.68 L 436.4 312.68" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="450.4" y="290.68" width="481.84" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="460.4" y="306.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">2. method guard, 10 per 10 minutes per IP, body capped at 64KB</text><line x1="436.4" y1="341.68" x2="687" y2="341.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="563.2" y="331.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3. verify token</text><path d="M 436.4 370.68 L 426.4 370.68 L 426.4 386.68 L 436.4 386.68" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="450.4" y="364.68" width="481.84" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="460.4" y="380.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">4. JWT to user, UUIDs checked, max 50 lines, quantity 1 to 99</text><line x1="436.4" y1="415.68" x2="940.6" y2="415.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="690" y="405.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">5. create_order(items, address) as the signed-in user</text><path d="M 943.6 444.68 L 933.6 444.68 L 933.6 460.68 L 943.6 460.68" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="957.6" y="438.68" width="481.84" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="967.6" y="454.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">6. reprice every line, check stock, decrement, insert order: one transaction</text><line x1="943.6" y1="489.68" x2="439.4" y2="489.68" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="690" y="479.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">7. order id and total</text><line x1="436.4" y1="523.67" x2="1194.2" y2="523.67" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="816.8" y="513.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">8. confirmation email</text><line x1="436.4" y1="557.67" x2="185.8" y2="557.67" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="309.6" y="547.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">9. 201 and the order id</text><rect x="56" y="620.67" width="1268" height="149" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><use href="#i-alert" x="72" y="630.67" width="16" height="16" color="#DC2F4B" /><text x="94" y="640.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="72" y="662.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">No session: 401 before anything is read.</text><text x="72" y="683.28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Bad or missing captcha token: 400, nothing written.</text><text x="72" y="703.88" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Out of stock: create_order raises, the transaction rolls back, no partial order.</text><text x="72" y="724.48" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Resend unavailable or key unset: the order stands and the email is skipped. Email never gates the order.</text><text x="72" y="745.08" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Today, in production: no environment variables, so the function cannot reach Supabase and returns 500.</text>
</svg>
