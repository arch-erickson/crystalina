<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1258 627.35" width="1258" height="627.35" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">The threats that apply, and what stands in front of each</title>
  <desc id="diagram-desc">Every threat that actually applies to this project, in the column that says whether anything stands in front of it. The text on each card is the mitigation. Click a card for why it carries that status and what it is tied to.</desc>
