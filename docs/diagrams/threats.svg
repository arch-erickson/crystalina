<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">The threats that apply, and what stands in front of each</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Every threat that actually applies to this project, in the column that says whether anything stands in front of it. The text on each card</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">is the mitigation. Click a card for why it carries that status and what it is tied to.</text><text x="1226" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-11-02</text><text x="1226" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="111.35" x2="1226" y2="111.35" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="34" y="167.35" width="370" height="280" rx="14" fill="#F0FDF5" stroke="#A2DEC1" stroke-width="1.4"/><rect x="50" y="152.35" width="130" height="30" rx="8" fill="#0E9F6E"/><text x="65" y="172.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Standing up</text><rect x="444" y="167.35" width="370" height="408" rx="14" fill="#FFFBEB" stroke="#F2D08C" stroke-width="1.4"/><rect x="460" y="152.35" width="157" height="30" rx="8" fill="#C2680C"/><text x="475" y="172.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Partly covered</text><rect x="854" y="167.35" width="370" height="250" rx="14" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1.4"/><rect x="870" y="152.35" width="266" height="30" rx="8" fill="#DC2F4B"/><text x="885" y="172.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="start">Nothing in front of it yet</text><g class="node" data-node="threat:orders"><rect x="59" y="230.35" width="330" height="86" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="54" y="225.35" width="330" height="86" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-eye" x="66" y="253.35" width="30" height="30" color="#E0455F" /><text x="106" y="250.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A visitor reads another</text><text x="106" y="266.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">customer's orders</text><text x="106" y="283.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Row level security on every table, every</text><text x="106" y="297.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">query carrying the signed-in JWT</text><rect x="285" y="216.35" width="87" height="18" rx="9" fill="#DCF5E8" stroke="#0E9F6E" stroke-opacity=".45"/><text x="328.5" y="229.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#0A7A54">Implemented</text></g><g class="node" data-node="threat:underpay"><rect x="59" y="332.35" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="54" y="327.35" width="330" height="100" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-card" x="66" y="362.35" width="30" height="30" color="#22C55E" /><text x="106" y="352.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A visitor pays less than the</text><text x="106" y="368.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">price</text><text x="106" y="385.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#19795A" text-anchor="start">create_order reprices every line in the</text><text x="106" y="399.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#19795A" text-anchor="start">database. The browser sends ids and</text><text x="106" y="413.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#19795A" text-anchor="start">quantities only</text><rect x="285" y="318.35" width="87" height="18" rx="9" fill="#DCF5E8" stroke="#0E9F6E" stroke-opacity=".45"/><text x="328.5" y="331.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#0A7A54">Implemented</text></g><g class="node" data-node="threat:xss"><rect x="469" y="230.35" width="330" height="86" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="464" y="225.35" width="330" height="86" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-alert" x="476" y="253.35" width="30" height="30" color="#E0455F" /><text x="516" y="250.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Staff text reaching another staff</text><text x="516" y="266.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">member as script</text><text x="516" y="283.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">escapeHTML in js/main.js, used on every</text><text x="516" y="297.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">interpolation</text><rect x="720" y="216.35" width="62" height="18" rx="9" fill="#FDF0D5" stroke="#C2680C" stroke-opacity=".45"/><text x="751" y="229.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#8A5207">Partial</text></g><g class="node" data-node="threat:gate"><rect x="469" y="332.35" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="464" y="327.35" width="330" height="56" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-lock" x="476" y="340.35" width="30" height="30" color="#8B5CF6" /><text x="516" y="352.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A customer opening a staff page</text><text x="516" y="369.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#6D4CB0" text-anchor="start">A policy, not markup</text><rect x="714" y="318.35" width="68" height="18" rx="9" fill="#F1E7FE" stroke="#7C3AED" stroke-opacity=".45"/><text x="748" y="331.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#6025CC">Refactor</text></g><g class="node" data-node="threat:spam"><rect x="469" y="404.35" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="464" y="399.35" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-filter" x="476" y="419.35" width="30" height="30" color="#E0455F" /><text x="516" y="424.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Form spam and abuse</text><text x="516" y="441.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Turnstile, plus a rate limit that</text><text x="516" y="455.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">survives the instance</text><rect x="720" y="390.35" width="62" height="18" rx="9" fill="#FDF0D5" stroke="#C2680C" stroke-opacity=".45"/><text x="751" y="403.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#8A5207">Partial</text></g><g class="node" data-node="threat:keys"><rect x="469" y="490.35" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.2"/><rect x="464" y="485.35" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><use href="#i-key" x="476" y="505.35" width="30" height="30" color="#8B5CF6" /><text x="516" y="510.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A leaked key</text><text x="516" y="527.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#6D4CB0" text-anchor="start">Secrets per environment in the platform</text><text x="516" y="541.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#6D4CB0" text-anchor="start">store, never in the repository</text><rect x="720" y="476.35" width="62" height="18" rx="9" fill="#FDF0D5" stroke="#C2680C" stroke-opacity=".45"/><text x="751" y="489.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#8A5207">Partial</text></g><g class="node" data-node="threat:double"><rect x="874" y="225.35" width="330" height="70" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/><use href="#i-undo" x="886" y="245.35" width="30" height="30" color="#22C55E" /><text x="926" y="250.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">Payment taken twice</text><text x="926" y="267.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#19795A" text-anchor="start">A webhook write keyed on the Stripe event</text><text x="926" y="281.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#19795A" text-anchor="start">id</text><rect x="1130" y="216.35" width="62" height="18" rx="9" fill="#FCE4E7" stroke="#DC2F4B" stroke-opacity=".45" stroke-dasharray="4 3"/><text x="1161" y="229.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#B21E38">Missing</text></g><g class="node" data-node="threat:inject"><rect x="874" y="311.35" width="330" height="86" rx="8" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4"/><use href="#i-browser" x="886" y="339.35" width="30" height="30" color="#94A3B8" /><text x="926" y="336.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">A third-party script changing the</text><text x="926" y="352.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="13" font-weight="600" fill="#0F172A" text-anchor="start">page</text><text x="926" y="369.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5A6675" text-anchor="start">A Content-Security-Policy, after the</text><text x="926" y="383.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#5A6675" text-anchor="start">inline handlers are gone</text><rect x="1124" y="302.35" width="68" height="18" rx="9" fill="#EEF1F5" stroke="#64748B" stroke-opacity=".45" stroke-dasharray="2 3"/><text x="1158" y="315.35" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#505C6B">Post-MVP</text></g><text x="34" y="605.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.1">STATUS</text><rect x="78.67" y="592.35" width="79.22" height="18" rx="9" fill="#DCF5E8" stroke="#A2DEC1" stroke-width="1" /><text x="118.28" y="604.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#0A7A54" text-anchor="middle" letter-spacing="0.1">Implemented</text><rect x="163.89" y="592.35" width="56.23" height="18" rx="9" fill="#FDF0D5" stroke="#F2D08C" stroke-width="1" /><text x="192.01" y="604.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#8A5207" text-anchor="middle" letter-spacing="0.1">Partial</text><rect x="226.13" y="592.35" width="56.23" height="18" rx="9" fill="#FCE4E7" stroke="#F4B3BC" stroke-width="1" stroke-dasharray="4 3" /><text x="254.24" y="604.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#B21E38" text-anchor="middle" letter-spacing="0.1">Missing</text><rect x="288.36" y="592.35" width="61.98" height="18" rx="9" fill="#F1E7FE" stroke="#D2BAF7" stroke-width="1" /><text x="319.35" y="604.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#6025CC" text-anchor="middle" letter-spacing="0.1">Refactor</text><rect x="356.34" y="592.35" width="61.98" height="18" rx="9" fill="#EEF1F5" stroke="#D5DCE4" stroke-width="1" stroke-dasharray="2 3" /><text x="387.33" y="604.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#505C6B" text-an