<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 692.03" width="1060" height="692.03" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Risks</title>
  <desc id="diagram-desc">Placed by how likely it is and what it costs if ignored. Top right is what to fix first, and position carries the severity as well as the colour does, so a monochrome printout loses nothing. Click any risk for what to do about it.</desc>
