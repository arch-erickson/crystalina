<text x="32" y="46" font-family="'Playfair Display',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Risks</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Placed by how likely it is and what it costs if ignored. Top right is what to fix first, and position carries</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">the severity as well as the colour does, so a monochrome printout loses nothing. Click any risk for what to</text><text x="32" y="103.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">do about it.</text><text x="1028" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-11-02</text><text x="1028" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="128.03" x2="1028" y2="128.03" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><text x="118" y="164.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.1">IMPACT IF IGNORED</text><text x="268" y="182.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">LOW</text><text x="568" y="182.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">MEDIUM</text><text x="868" y="182.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="1">HIGH</text><text x="104" y="268.02" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="end" letter-spacing="1">HIGH</text><rect x="118" y="192.03" width="292" height="144" rx="9" fill="#FFFBEB" stroke="#E2E8F0" stroke-width="1" /><g class="node" data-node="risk:R8"><circle cx="136" cy="214.03" r="9.5" fill="#C2680C" stroke="none" stroke-width="1" /><text x="136" y="217.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R8</text><text x="153" y="218.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Stripe test key pasted into a</text><text x="153" y="230.63" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">chat transcript</text><text x="398" y="218.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#9A6214" text-anchor="end">Minutes</text></g><rect x="418" y="192.03" width="292" height="144" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><g class="node" data-node="risk:R5"><circle cx="436" cy="214.03" r="9.5" fill="#DC2F4B" stroke="none" stroke-width="1" /><text x="436" y="217.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R5</text><text x="453" y="218.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">The domain still points at the</text><text x="453" y="230.63" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">half that cannot run code</text><text x="698" y="218.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#B23347" text-anchor="end">Phase 5</text></g><g class="node" data-node="risk:R9"><circle cx="436" cy="251.23" r="9.5" fill="#DC2F4B" stroke="none" stroke-width="1" /><text x="436" y="254.93" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R9</text><text x="453" y="255.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Most of the shelf reads as</text><text x="453" y="267.83" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">sold out</text><text x="698" y="255.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#B23347" text-anchor="end">Half a day</text></g><rect x="718" y="192.03" width="292" height="144" rx="9" fill="#FCE4E7" stroke="#F4B3BC" stroke-width="1" /><text x="736" y="220.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start" font-style="italic">none</text><text x="104" y="420.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="end" letter-spacing="1">MEDIUM</text><rect x="118" y="344.03" width="292" height="144" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><text x="136" y="372.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start" font-style="italic">none</text><rect x="418" y="344.03" width="292" height="144" rx="9" fill="#FFFBEB" stroke="#E2E8F0" stroke-width="1" /><text x="436" y="372.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="start" font-style="italic">none</text><rect x="718" y="344.03" width="292" height="144" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><g class="node" data-node="risk:R2"><circle cx="736" cy="366.03" r="9.5" fill="#DC2F4B" stroke="none" stroke-width="1" /><text x="736" y="369.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R2</text><text x="753" y="370.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Payment taken twice on a</text><text x="753" y="382.63" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">webhook redelivery</text><text x="998" y="370.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#B23347" text-anchor="end">Half a day, inside phase 3</text></g><g class="node" data-node="risk:R4"><circle cx="736" cy="403.23" r="9.5" fill="#DC2F4B" stroke="none" stroke-width="1" /><text x="736" y="406.92" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R4</text><text x="753" y="407.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Every private page gated in</text><text x="753" y="419.83" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">the browser only</text><text x="998" y="407.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#B23347" text-anchor="end">A day</text></g><g class="node" data-node="risk:R6"><circle cx="736" cy="440.42" r="9.5" fill="#DC2F4B" stroke="none" stroke-width="1" /><text x="736" y="444.12" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R6</text><text x="753" y="444.42" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Unverified NYC water figures</text><text x="753" y="457.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">published as fact</text><text x="998" y="444.42" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#B23347" text-anchor="end">Half a day</text></g><text x="104" y="572.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="700" fill="#0F172A" text-anchor="end" letter-spacing="1">LOW</text><rect x="118" y="496.03" width="292" height="144" rx="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" /><g class="node" data-node="risk:R10"><circle cx="136" cy="518.03" r="9.5" fill="#64748B" stroke="none" stroke-width="1" /><text x="136" y="521.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R10</text><text x="153" y="522.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Worker size and CPU limits on</text><text x="153" y="534.63" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">the free plan</text><text x="398" y="522.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#5A6675" text-anchor="end">Minutes</text></g><rect x="418" y="496.03" width="292" height="144" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" /><g class="node" data-node="risk:R3"><circle cx="436" cy="518.03" r="9.5" fill="#64748B" stroke="none" stroke-width="1" /><text x="436" y="521.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R3</text><text x="453" y="522.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">Rate limit does not survive</text><text x="453" y="534.63" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">the instance</text><text x="698" y="522.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#5A6675" text-anchor="end">Done at the application layer; an hour at P5</text></g><g class="node" data-node="risk:R11"><circle cx="436" cy="555.23" r="9.5" fill="#64748B" stroke="none" stroke-width="1" /><text x="436" y="558.93" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R11</text><text x="453" y="559.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">The repository is published</text><text x="453" y="571.83" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start">with the site</text><text x="698" y="559.23" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.4" font-weight="600" fill="#5A6675" text-anchor="end">Owner action</text></g><rect x="718" y="496.03" width="292" height="144" rx="9" fill="#FFFBEB" stroke="#E2E8F0" stroke-width="1" /><g class="node" data-node="risk:R1"><circle cx="736" cy="518.03" r="9.5" fill="#C2680C" stroke="none" stroke-width="1" /><text x="736" y="521.73" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="8.6" font-weight="700" fill="#FFFFFF" text-anchor="middle">R1</text><text x="753" y="522.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.6" font-weight="400" fill="#0F172A" text-anchor="start