95.67" y2="492.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="911.33" y="140.68" width="191.33" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-database" x="951.75" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1017" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Postgres</text><text x="1007" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">contact_messages</text><line x1="1007" y1="192.68" x2="1007" y2="492.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="1122.67" y="140.68" width="191.33" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-mail" x="1170.65" y="149.68" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1228.33" y="163.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Resend</text><text x="1218.33" y="182.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">to the inbox</text><line x1="1218.33" y1="192.68" x2="1218.33" y2="492.68" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><line x1="161.67" y1="253.68" x2="370" y2="253.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="267.33" y="243.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">1. POST with a Turnstile token</text><line x1="373" y1="287.68" x2="581.33" y2="287.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="478.67" y="277.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">2. within the rate limit</text><line x1="584.33" y1="321.68" x2="792.67" y2="321.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="690" y="311.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3. verify the token</text><path d="M 584.33 350.68 L 574.33 350.68 L 574.33 366.68 L 584.33 366.68" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="598.33" y="344.68" width="401.53" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="608.33" y="360.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">4. clean and cap every field</text><line x1="584.33" y1="395.68" x2="1004" y2="395.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="795.67" y="385.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">5. insert with the service role</text><line x1="584.33" y1="429.68" x2="1215.33" y2="429.68" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="901.33" y="419.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">6. notify CONTACT_INBOX</text><line x1="584.33" y1="463.68" x2="164.67" y2="463.68" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="373" y="453.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">7. 200 and the success state</text><rect x="56" y="526.67" width="1268" height="128.4" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><use href="#i-alert" x="72" y="536.67" width="16" height="16" color="#DC2F4B" /><text x="94" y="546.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="72" y="568.67" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">No widget on the form today, so no token is sent and verification is skipped while the secret is unset.</text><text x="72" y="589.28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Rate limit is in-process only today: serverless instances are short lived and unshared, so it blunts casual abuse and nothing more.</text><text x="72" y="609.88" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Mail fails: the row is already written and the submission is not lost.</text><text x="72" y="630.48" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Today, in production: 500. The environment variables are not set, so the function cannot reach Supabase.</text>
