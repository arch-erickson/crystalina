r="start">to the inbox</text><path d="M136 144 H314" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="144" r="9" fill="#3B82F6"/><text x="122" y="147.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M332 192 H510" fill="none" stroke="#E0455F" stroke-width="2" stroke-linecap="round" marker-end="url(#m-rose)"/><circle cx="318" cy="192" r="9" fill="#E0455F"/><text x="318" y="195.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M528 240 H706" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="514" cy="240" r="9" fill="#E29A12"/><text x="514" y="243.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M518 266 H548 Q556 266 556 274 V284 Q556 292 548 292 H522" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="500" cy="266" r="9" fill="#E29A12"/><text x="500" y="269.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M528 336 H902" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="514" cy="336" r="9" fill="#E29A12"/><text x="514" y="339.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M528 384 H1098" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="514" cy="384" r="9" fill="#E29A12"/><text x="514" y="387.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M500 432 H126" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)" stroke-dasharray="6 5"/><circle cx="514" cy="432" r="9" fill="#E29A12"/><text x="514" y="435.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="220" y="118" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">POST with a Turnstile</text><text x="220" y="132" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">token</text><text x="416" y="180" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">within the rate limit</text><text x="612" y="228" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">verify the token</text><text x="566" y="275" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">clean and cap every field</text><text x="710" y="324" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">insert with the service role</text><text x="808" y="372" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">notify CONTACT_INBOX</text><text x="318" y="420" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">200 and the success state</text></g><rect x="34" y="673.35" width="1156" height="132" rx="10" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><rect x="34" y="673.35" width="4.5" height="132" rx="2" fill="#DC2F4B" stroke="none" stroke-width="1" /><use href="#i-alert" x="52" y="687.35" width="17" height="17" color="#DC2F4B" /><text x="77" y="700.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="52" y="723.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">No widget on the form today, so no token is sent and verification is skipped while the secret is unset.</text><text x="52" y="744.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Rate limit is in-process only today: serverless instances are short lived and unshared, so it blunts casual abuse and nothing more.</text><text x="52" y="766.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Mail fails: the row is already written and the submission is not lost.</text><text x="52" y="787.85" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Today, in production: 500. The environment variables are not set, so the function cannot reach Supabase.</text>
</svg>
