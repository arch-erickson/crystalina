<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 721.75" width="1380" height="721.75" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Signing in, and what a role is allowed to do</title>
  <desc id="diagram-desc">The data is protected by row level security, which is the part that matters. What is wrong is the gate in front of the dashboards: it is markup, and markup is a suggestion.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
  <defs><marker id="m-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#1D6FE0" /></marker><marker id="m-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#C2680C" /></marker><marker id="m-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#7C3AED" /></marker><marker id="m-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#0D9488" /></marker><marker id="m-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#0E9F6E" /></marker><marker id="m-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#DC2F4B" /></marker><marker id="m-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#64748B" /></marker><marker id="m-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0.6 L 9.4 5 L 0 9.4 z" fill="#15375D" /></marker></defs>
  <defs><symbol id="i-alert" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 29.5 27.5h-27z" fill="currentColor" fill-opacity=".2"/><path d="M16 4 29.5 27.5h-27z"/><path d="M16 13v6M16 23.2h.01"/></g></symbol><symbol id="i-browser" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="22" rx="3.5" fill="currentColor" fill-opacity=".16"/><rect x="3" y="5" width="26" height="22" rx="3.5"/><path d="M3 12h26"/><path d="M7 8.5h.01M11 8.5h.01M15 8.5h.01"/></g></symbol><symbol id="i-database" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8" fill="currentColor" fill-opacity=".22"/><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8"/><path d="M5.5 7.5v17c0 2.1 4.7 3.8 10.5 3.8s10.5-1.7 10.5-3.8v-17"/><path d="M5.5 16c0 2.1 4.7 3.8 10.5 3.8S26.5 18.1 26.5 16"/></g></symbol><symbol id="i-key" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="21" r="6.2" fill="currentColor" fill-opacity=".2"/><circle cx="11" cy="21" r="6.2"/><path d="M15.4 16.6 27.5 4.5"/><path d="M21.5 10.5l3.2 3.2M24.4 7.6l3.2 3.2"/></g></symbol><symbol id="i-page" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h11L25.5 11v17.5H7z" fill="currentColor" fill-opacity=".14"/><path d="M7 3.5h11L25.5 11v17.5H7z"/><path d="M18 3.5V11h7.5"/><path d="M11 17h10M11 21.5h10"/></g></symbol></defs>
  <rect width="1380" height="721.75" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Signing in, and what a role is allowed to do</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">The data is protected by row level security, which is the part that matters. What is wrong is the gate in front of the dashboards: it is markup, and markup</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">is a suggestion.</text><text x="1348" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-09</text><text x="1348" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="111.35" x2="1348" y2="111.35" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="1288.02" y="125.35" width="61.98" height="18" rx="9" fill="#F1E7FE" stroke="#D2BAF7" stroke-width="1" /><text x="1319.01" y="137.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#6025CC" text-anchor="middle" letter-spacing="0.1">Refactor</text><rect x="66" y="157.35" width="297" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-browser" x="163.03" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="224.5" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Browser</text><text x="214.5" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/signin/</text><line x1="214.5" y1="209.35" x2="214.5" y2="515.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="383" y="157.35" width="297" height="52" rx="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="1" /><use href="#i-key" x="457.34" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="541.5" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Supabase Auth</text><text x="531.5" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">email and password</text><line x1="531.5" y1="209.35" x2="531.5" y2="515.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="700" y="157.35" width="297" height="52" rx="10" fill="#7C3AED" stroke="#7C3AED" stroke-width="1" /><use href="#i-page" x="770.56" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="858.5" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dashboard page</text><text x="848.5" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/admin/, /manager/, ...</text><line x1="848.5" y1="209.35" x2="848.5" y2="515.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="1017" y="157.35" width="297" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-database" x="1110.25" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1175.5" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Postgres</text><text x="1165.5" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">RLS and has_role()</text><line x1="1165.5" y1="209.35" x2="1165.5" y2="515.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><line x1="214.5" y1="270.35" x2="528.5" y2="270.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="373" y="260.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">1. email and password</text><line x1="531.5" y1="304.35" x2="217.5" y2="304.35" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="373" y="294.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">2. session and JWT</text><line x1="214.5" y1="338.35" x2="845.5" y2="338.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="531.5" y="328.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3. open a staff page</text><path d="M 848.5 367.35 L 838.5 367.35 L 838.5 383.35 L 848.5 383.35" fill="none" stroke="#C2680C" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-amber)" /><rect x="862.5" y="361.35" width="602.3" height="28" rx="7" fill="#FFFBEB" stroke="#C2680C" stroke-width="1" /><text x="872.5" y="377.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#6B3F08" text-anchor="start">4. today: the page itself decides what to show. This is the hole</text><line x1="848.5" y1="412.35" x2="1162.5" y2="412.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="1007" y="402.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">5. every query carries the JWT</text><path d="M 1165.5 441.35 L 1155.5 441.35 L 1155.5 457.35 L 1165.5 457.35" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="1179.5" y="435.35" width="602.3" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="1189.5" y="451.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">6. row level security, and private.has_role() on every privileged function</text><line x1="1165.5" y1="486.35" x2="851.5" y2="486.35" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="1007" y="476.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">7. only the rows this role may see</text><rect x="56" y="549.35" width="1268" height="128.4" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><use href="#i-alert" x="72" y="559.35" width="16" height="16" color="#DC2F4B" /><text x="94" y="569.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="72" y="591.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Customer opens /admin/ directly: the markup renders, and every query returns nothing. Verifying that "nothing" really is nothing is U1.</text><text x="72" y="611.95" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Expired JWT: queries fail closed, and the page sends the visitor back to sign in.</text><text x="72" y="632.55" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Role removed while signed in: the next query fails, not the next page load.</text><text x="72" y="653.15" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Password reset and email verification do not exist yet, so a locked-out customer has no self-service path.</text>
</svg>
