  <rect width="860" height="895.53" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Signing in, and what a role is allowed to do</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">The data is protected by row level security, which is the part that matters.</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">What is wrong is the gate in front of the dashboards: it is markup, and markup</text><text x="32" y="103.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">is a suggestion.</text><text x="828" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-11</text><text x="828" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="128.03" x2="828" y2="128.03" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="758" y="144.03" width="68" height="18" rx="9" fill="#F1E7FE" stroke="#7C3AED" stroke-opacity=".45"/><text x="792" y="157.03" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#6025CC">Refactor</text><g transform="translate(0 182.025)"><path d="M122 62 V480" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="37" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="33" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="33" y="0" width="5" height="62" rx="2" fill="#3B82F6"/><use href="#i-browser" x="45" y="17" width="28" height="28" color="#3B82F6" /><text x="79" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Browser</text><text x="79" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#2F6CAE" text-anchor="start">/signin/</text><path d="M318 62 V480" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="233" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="229" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="229" y="0" width="5" height="62" rx="2" fill="#8B5CF6"/><use href="#i-key" x="241" y="17" width="28" height="28" color="#8B5CF6" /><text x="275" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Supabase Auth</text><text x="275" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#6D4CB0" text-anchor="start">email and password</text><path d="M514 62 V480" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="429" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="425" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="425" y="0" width="5" height="62" rx="2" fill="#8B5CF6"/><use href="#i-page" x="437" y="17" width="28" height="28" color="#8B5CF6" /><text x="471" y="21.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Dashboard page</text><text x="471" y="36.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#6D4CB0" text-anchor="start">/admin/, /manager/,</text><text x="471" y="49.5" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#6D4CB0" text-anchor="start">...</text><path d="M710 62 V480" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="625" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="621" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="621" y="0" width="5" height="62" rx="2" fill="#14B8A6"/><use href="#i-database" x="633" y="17" width="28" height="28" color="#14B8A6" /><text x="667" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Postgres</text><text x="667" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">RLS and has_role()</text><path d="M136 130 H314" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="130" r="9" fill="#3B82F6"/><text x="122" y="133.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M304 178 H126" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-violet)" stroke-dasharray="6 5"/><circle cx="318" cy="178" r="9" fill="#8B5CF6"/><text x="318" y="181.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M136 226 H510" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="226" r="9" fill="#3B82F6"/><text x="122" y="229.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M518 252 H548 Q556 252 556 260 V270 Q556 278 548 278 H522" fill="none" stroke="#E0455F" stroke-width="2" stroke-linecap="round" marker-end="url(#m-rose)"/><circle cx="500" cy="252" r="9" fill="#E0455F"/><text x="500" y="255.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M528 338 H706" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-violet)"/><circle cx="514" cy="338" r="9" fill="#8B5CF6"/><text x="514" y="341.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M714 364 H744 Q752 364 752 372 V382 Q752 390 744 390 H718" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-teal)"/><circle cx="696" cy="364" r="9" fill="#14B8A6"/><text x="696" y="367.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M696 450 H518" fill="none" stroke="#14B8A6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-teal)" stroke-dasharray="6 5"/><circle cx="710" cy="450" r="9" fill="#14B8A6"/><text x="710" y="453.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><text x="220" y="118" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">email and password</text><text x="220" y="166" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">session and JWT</text><text x="318" y="214" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">open a staff page</text><text x="566" y="261" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">today: the page itself decides what to show. This</text><text x="566" y="275" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">is the hole</text><text x="612" y="312" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">every query carries the</text><text x="612" y="326" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">JWT</text><text x="762" y="373" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">row level security, and private.has_role() on</text><text x="762" y="387" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">every privileged function</text><text x="612" y="424" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">only the rows this role</text><text x="612" y="438" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">may see</text></g><rect x="34" y="708.03" width="792" height="147.5" rx="10" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><rect x="34" y="708.03" width="4.5" height="147.5" rx="2" fill="#DC2F4B" stroke="none" stroke-width="1" /><use href="#i-alert" x="52" y="722.03" width="17" height="17" color="#DC2F4B" /><text x="77" y="735.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="52" y="758.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Customer opens /admin/ directly: the markup renders, and every query returns nothing. Verifying that</text><text x="52" y="773.53" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">"nothing" really is nothing is U1.</text><text x="52" y="795.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Expired JWT: queries fail closed, and the page sends the visitor back to sign in.</text><text x="52" y="816.53" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Role removed while signed in: the next query fails, not the next page load.</text><text x="52" y="838.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Password reset and email verification do not exist yet, so a locked-out customer has no self-service path.</text>
</svg>
