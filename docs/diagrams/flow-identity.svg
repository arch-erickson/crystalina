<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 895.53" width="860" height="895.53" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Signing in, and what a role is allowed to do</title>
  <desc id="diagram-desc">The data is protected by row level security, which is the part that matters. What is wrong is the gate in front of the dashboards: it is markup, and markup is a suggestion.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
