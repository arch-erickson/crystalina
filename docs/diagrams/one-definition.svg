<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 608.03" width="1180" height="608.03" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">One definition, read everywhere</title>
  <desc id="diagram-desc">Anything that appears twice is built once, and a variation is a parameter rather than a second copy. Three rows below have a second copy: the free shipping threshold, written out ten times in six files; the schema.org list of social profiles; and the five blocks of home page items still sitting in the markup.</desc>
