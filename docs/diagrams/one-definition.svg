<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 589.35" width="1180" height="589.35" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">One definition, read everywhere</title>
  <desc id="diagram-desc">Anything that appears twice is built once, and a variation is a parameter rather than a second copy. Three rows below have no single home yet; each one is a small, dull job that gets expensive the week a price changes in two of three places.</desc>
