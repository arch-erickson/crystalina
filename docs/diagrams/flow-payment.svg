<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Taking the money (Stripe, phase 3)</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Nothing of this exists yet. Drawn because it is the one flow that must be right the first time: a payment</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">that is taken twice, or an order marked paid that was not, is not a bug you can apologise your way out</text><text x="32" y="103.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">of.</text><text x="996" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-11</text><text x="996" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="128.03" x2="996" y2="128.03" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="932" y="144.03" width="62" height="18" rx="9" fill="#FCE4E7" stroke="#DC2F4B" stroke-opacity=".45" stroke-dasharray="4 3"/><text x="963" y="157.03" text-anchor="middle" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="600" fill="#B21E38">Missing</text><g transform="translate(0 182.025)"><path d="M122 62 V600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="37" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="33" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="33" y="0" width="5" height="62" rx="2" fill="#3B82F6"/><use href="#i-browser" x="45" y="17" width="28" height="28" color="#3B82F6" /><text x="79" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Browser</text><text x="79" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#2F6CAE" text-anchor="start">/checkout/</text><path d="M318 62 V600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="233" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="229" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="229" y="0" width="5" height="62" rx="2" fill="#E29A12"/><use href="#i-bolt" x="241" y="17" width="28" height="28" color="#E29A12" /><text x="275" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Pages Function</text><text x="275" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#9A6214" text-anchor="start">/api/checkout/session</text><path d="M514 62 V600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="429" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="425" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="425" y="0" width="5" height="62" rx="2" fill="#22C55E"/><use href="#i-card" x="437" y="17" width="28" height="28" color="#22C55E" /><text x="471" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Stripe</text><text x="471" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#19795A" text-anchor="start">Checkout</text><path d="M710 62 V600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="625" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="621" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="621" y="0" width="5" height="62" rx="2" fill="#E29A12"/><use href="#i-bolt" x="633" y="17" width="28" height="28" color="#E29A12" /><text x="667" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Pages Function</text><text x="667" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#9A6214" text-anchor="start">/api/stripe/webhook</text><path d="M906 62 V600" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="821" y="4" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.1"/><rect x="817" y="0" width="178" height="62" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/><rect x="817" y="0" width="5" height="62" rx="2" fill="#14B8A6"/><use href="#i-database" x="829" y="17" width="28" height="28" color="#14B8A6" /><text x="863" y="28" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Postgres</text><text x="863" y="43" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.3" font-weight="400" fill="#157F76" text-anchor="start">orders</text><path d="M136 130 H314" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="130" r="9" fill="#3B82F6"/><text x="122" y="133.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><path d="M332 178 H902" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="318" cy="178" r="9" fill="#E29A12"/><text x="318" y="181.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M332 240 H510" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="318" cy="240" r="9" fill="#E29A12"/><text x="318" y="243.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M304 288 H126" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)" stroke-dasharray="6 5"/><circle cx="318" cy="288" r="9" fill="#E29A12"/><text x="318" y="291.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M136 336 H510" fill="none" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" marker-end="url(#m-blue)"/><circle cx="122" cy="336" r="9" fill="#3B82F6"/><text x="122" y="339.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M528 384 H706" fill="none" stroke="#22C55E" stroke-width="2" stroke-linecap="round" marker-end="url(#m-green)"/><circle cx="514" cy="384" r="9" fill="#22C55E"/><text x="514" y="387.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><path d="M714 410 H744 Q752 410 752 418 V428 Q752 436 744 436 H718" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="696" cy="410" r="9" fill="#E29A12"/><text x="696" y="413.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text><path d="M724 508 H902" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)"/><circle cx="710" cy="508" r="9" fill="#E29A12"/><text x="710" y="511.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><path d="M696 570 H518" fill="none" stroke="#E29A12" stroke-width="2" stroke-linecap="round" marker-end="url(#m-amber)" stroke-dasharray="6 5"/><circle cx="710" cy="570" r="9" fill="#E29A12"/><text x="710" y="573.6" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">9</text><text x="220" y="118" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">cart ids and quantities</text><text x="612" y="166" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">reprice the cart server side. Never trust a browser total</text><text x="416" y="214" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">create Checkout Session</text><text x="416" y="228" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">with the repriced lines</text><text x="220" y="276" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">session URL</text><text x="318" y="324" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">customer pays on Stripe</text><text x="612" y="372" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">checkout.session.completed</text><text x="762" y="419" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="start">verify the signature, then look up by event id</text><text x="808" y="468" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">create_order, or mark</text><text x="808" y="482" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">paid. Keyed, so a retry</text><text x="808" y="496" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">cannot duplicate it</text><text x="612" y="544" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">200, or Stripe</text><text x="612" y="558" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="500" fill="#334155" text-anchor="middle">redelivers</text></g><rect x="34" y="828.03" width="960" height="153.5" rx="10" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><rect x="34" y="828.03" width="4.5" height="153.5" rx="2" fill="#DC2F4B" stroke="none" stroke-width="1" /><use href="#i-alert" x="52" y="842.03" width="17" height="17" color="#DC2F4B" /><text x="77" y="855.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="52" y="878.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Unsigned or wrongly signed webhook: 400, nothing written.</text><text x="52" y="899.53" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Stripe redelivers the same event: the write is keyed on the event id, so the second one is a no-op.</text><text x="52" y="921.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Customer abandons the hosted page: no order, and the cart is untouched.</text><text x="52" y="942.53" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">Webhook arrives before the browser returns: the webhook is the source of truth, never the redirect.</text><text x="52" y="964.03" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#B23347" text-anchor="start">The test secret key that was pasted into a chat transcript is rolled before any of this ships.</text>
</svg>
