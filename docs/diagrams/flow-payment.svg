  <defs><symbol id="i-alert" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4 29.5 27.5h-27z" fill="currentColor" fill-opacity=".2"/><path d="M16 4 29.5 27.5h-27z"/><path d="M16 13v6M16 23.2h.01"/></g></symbol><symbol id="i-bolt" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.5 3 7 17.5h7.5L13.5 29 25 14.5h-7.5z" fill="currentColor" fill-opacity=".2"/><path d="M18.5 3 7 17.5h7.5L13.5 29 25 14.5h-7.5z"/></g></symbol><symbol id="i-browser" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="26" height="22" rx="3.5" fill="currentColor" fill-opacity=".16"/><rect x="3" y="5" width="26" height="22" rx="3.5"/><path d="M3 12h26"/><path d="M7 8.5h.01M11 8.5h.01M15 8.5h.01"/></g></symbol><symbol id="i-card" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="26" height="18" rx="3" fill="currentColor" fill-opacity=".18"/><rect x="3" y="7" width="26" height="18" rx="3"/><path d="M3 13h26"/><path d="M7.5 19.5h5"/></g></symbol><symbol id="i-database" viewBox="0 0 32 32"><g fill="none" stroke="#15375D" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8" fill="currentColor" fill-opacity=".22"/><ellipse cx="16" cy="7.5" rx="10.5" ry="3.8"/><path d="M5.5 7.5v17c0 2.1 4.7 3.8 10.5 3.8s10.5-1.7 10.5-3.8v-17"/><path d="M5.5 16c0 2.1 4.7 3.8 10.5 3.8S26.5 18.1 26.5 16"/></g></symbol></defs>
  <rect width="1380" height="832.35" fill="#FFFFFF" />
<text x="32" y="46" font-family="'Playfair Display','Canela',Georgia,serif" font-size="22" font-weight="600" fill="#0F172A" text-anchor="start">Taking the money (Stripe, phase 3)</text><text x="32" y="70" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">Nothing of this exists yet. Drawn because it is the one flow that must be right the first time: a payment that is taken twice, or an order marked paid that</text><text x="32" y="86.68" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="start">was not, is not a bug you can apologise your way out of.</text><text x="1348" y="40" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Generated 2026-10-09</text><text x="1348" y="56" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10" font-weight="400" fill="#94A3B8" text-anchor="end">Source: docs/diagrams/model.mjs</text><line x1="32" y1="111.35" x2="1348" y2="111.35" stroke="#E2E8F0" stroke-width="1" stroke-linecap="butt" /><rect x="1293.77" y="125.35" width="56.23" height="18" rx="9" fill="#FCE4E7" stroke="#F4B3BC" stroke-width="1" stroke-dasharray="4 3" /><text x="1321.88" y="137.72" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="600" fill="#B21E38" text-anchor="middle" letter-spacing="0.1">Missing</text><rect x="66" y="157.35" width="233.6" height="52" rx="10" fill="#1D6FE0" stroke="#1D6FE0" stroke-width="1" /><use href="#i-browser" x="131.33" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="192.8" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Browser</text><text x="182.8" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/checkout/</text><line x1="182.8" y1="209.35" x2="182.8" y2="605.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="319.6" y="157.35" width="233.6" height="52" rx="10" fill="#C2680C" stroke="#C2680C" stroke-width="1" /><use href="#i-bolt" x="358.46" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="446.4" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pages Function</text><text x="436.4" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/api/checkout/session</text><line x1="436.4" y1="209.35" x2="436.4" y2="605.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="573.2" y="157.35" width="233.6" height="52" rx="10" fill="#0E9F6E" stroke="#0E9F6E" stroke-width="1" /><use href="#i-card" x="642.31" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="700" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Stripe</text><text x="690" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">Checkout</text><line x1="690" y1="209.35" x2="690" y2="605.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="826.8" y="157.35" width="233.6" height="52" rx="10" fill="#C2680C" stroke="#C2680C" stroke-width="1" /><use href="#i-bolt" x="865.66" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="953.6" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Pages Function</text><text x="943.6" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">/api/stripe/webhook</text><line x1="943.6" y1="209.35" x2="943.6" y2="605.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><rect x="1080.4" y="157.35" width="233.6" height="52" rx="10" fill="#0D9488" stroke="#0D9488" stroke-width="1" /><use href="#i-database" x="1141.95" y="166.35" width="18" height="18" color="#FFFFFF" opacity="0.92" /><text x="1207.2" y="180.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Postgres</text><text x="1197.2" y="199.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.8" font-weight="400" fill="#FFFFFF" text-anchor="middle" opacity="0.74">orders</text><line x1="1197.2" y1="209.35" x2="1197.2" y2="605.35" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="butt" stroke-dasharray="3 4" /><line x1="182.8" y1="270.35" x2="433.4" y2="270.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="309.6" y="260.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">1. cart ids and quantities</text><line x1="436.4" y1="304.35" x2="1194.2" y2="304.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="816.8" y="294.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">2. reprice the cart server side. Never trust a browser total</text><line x1="436.4" y1="345.35" x2="687" y2="345.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="563.2" y="322.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">3. create Checkout Session with the</text><text x="563.2" y="335.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">repriced lines</text><line x1="436.4" y1="386.35" x2="185.8" y2="386.35" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="309.6" y="376.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">4. session URL</text><line x1="182.8" y1="420.35" x2="687" y2="420.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="436.4" y="410.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">5. customer pays on Stripe</text><line x1="690" y1="454.35" x2="940.6" y2="454.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="816.8" y="444.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">6. checkout.session.completed</text><path d="M 943.6 483.35 L 933.6 483.35 L 933.6 499.35 L 943.6 499.35" fill="none" stroke="#1D6FE0" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#m-blue)" /><rect x="957.6" y="477.35" width="481.84" height="28" rx="7" fill="#F8FAFC" stroke="#1D6FE0" stroke-width="1" stroke-dasharray="3 3" /><text x="967.6" y="493.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#0F172A" text-anchor="start">7. verify the signature, then look up by event id</text><line x1="943.6" y1="535.35" x2="1194.2" y2="535.35" stroke="#1D6FE0" stroke-width="1.6" stroke-linecap="butt" marker-end="url(#m-blue)" /><text x="1070.4" y="512.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">8. create_order, or mark paid. Keyed,</text><text x="1070.4" y="525.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="500" fill="#2F6CAE" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">so a retry cannot duplicate it</text><line x1="943.6" y1="576.35" x2="693" y2="576.35" stroke="#64748B" stroke-width="1.2" stroke-linecap="butt" stroke-dasharray="5 4" marker-end="url(#m-mute)" /><text x="816.8" y="566.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.5" font-weight="400" fill="#5A6675" text-anchor="middle" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">9. 200, or Stripe redelivers</text><rect x="56" y="639.35" width="1268" height="149" rx="9" fill="#FEF2F3" stroke="#F4B3BC" stroke-width="1" /><use href="#i-alert" x="72" y="649.35" width="16" height="16" color="#DC2F4B" /><text x="94" y="659.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="9.5" font-weight="700" fill="#B21E38" text-anchor="start" letter-spacing="1.1">THE FAILURE PATH, AND WHAT IS WRONG WITH IT TODAY</text><text x="72" y="681.35" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Unsigned or wrongly signed webhook: 400, nothing written.</text><text x="72" y="701.95" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Stripe redelivers the same event: the write is keyed on the event id, so the second one is a no-op.</text><text x="72" y="722.55" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Customer abandons the hosted page: no order, and the cart is untouched.</text><text x="72" y="743.15" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">Webhook arrives before the browser returns: the webhook is the source of truth, never the redirect.</text><text x="72" y="763.75" font-family="'Montserrat','Segoe UI',system-ui,sans-serif" font-size="10.8" font-weight="400" fill="#B23347" text-anchor="start">The test secret key that was pasted into a chat transcript is rolled before any of this ships.</text>
</svg>
