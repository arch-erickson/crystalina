<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 832.35" width="1380" height="832.35" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Taking the money (Stripe, phase 3)</title>
  <desc id="diagram-desc">Nothing of this exists yet. Drawn because it is the one flow that must be right the first time: a payment that is taken twice, or an order marked paid that was not, is not a bug you can apologise your way out of.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
