<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 594.73" width="1120" height="594.73" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Performance budget</title>
  <desc id="diagram-desc">Target is the first screen on a mid-range phone over 4G. Measured 2026-11-03 with scripts/verify.mjs against the local server at 390px wide, whole page, uncompressed: the Worker compresses text, so CSS and JS weigh about a third of this in the field, and images, which do not compress, are the figure that matters. Desktop in brackets. Every page is over budget, and every page is over for one reason: photographs at two to four times the pixels they are shown at. Thumbnails of 1086 by 1448 are drawn at 262 wide; the logo mark of 1000px is drawn at 44. The fix is image variants and srcset, which is image work, and is logged in COORDINATION.md for the image session. Measured against a served copy.</desc>
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');]]></style>
