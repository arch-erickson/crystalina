<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=20261102-type-rule">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="page-hero">
    <div class="container"><h1 id="acctTitle">My Account</h1><p id="acctSub"></p></div>
  </section>

  <section class="section">
    <div class="container account-grid" id="acctGrid">
      <div class="panel">
        <h3 id="acctName"></h3>
        <p style="font-size:.86rem;color:var(--muted);" id="acctEmail"></p>
        <hr style="border:none;border-top:1px solid #e4ecf6;margin:18px 0;">
        <a href="/shop/" class="btn btn-outline btn-block btn-sm" style="margin-bottom:10px;">Shop Filters</a>
        <a href="/quiz/" class="btn btn-outline btn-block btn-sm" style="margin-bottom:10px;">Find Your Filter</a>
        <button class="btn btn-danger btn-block btn-sm" id="signOutBtn">Sign Out</button>
      </div>
      <div class="panel">
        <h3>Order History</h3>
        <div id="ordersWrap"></div>
      </div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js?v=20261103-redesign"></script>
<script src="/js/supabase-client.js?v=20261103-redesign"></script>
<script src="/js/data-remote.js?v=20261103-redesign"></script>
<script src="/js/store.js?v=20261103-redesign"></script>
<script src="/js/main.js?v=20261103-redesign"></script>
<script>
  const user = Store.currentUser();
  if (!user) location.href = '/signin/';

  initPage('');

  /* Staff are customers too. Signing in through the customer form used to
     bounce an admin straight to the dashboard, which left no way to see
     your own orders or check what a shopper sees. The choice is now
     explicit: this link goes one way, the switcher on the dashboard comes
     back. */
  const STAFF_ROUTES = { admin: '/admin/', manager: '/manager/', technician: '/technician/', sales: '/sales/' };
  const staffRole = ['admin', 'manager', 'sales', 'technician'].find(role => (user.roles || []).includes(role));
  if (staffRole) {
    const link = document.createElement('a');
    link.className = 'btn btn-outline';
    link.href = STAFF_ROUTES[staffRole];
    link.textContent = 'Switch to staff view';
    document.querySelector('#acctTitle').insertAdjacentElement('afterend', link);
  }

  document.getElementById('acctSub').textContent = 'Welcome back, ' + user.name.split(' ')[0] + '!';
  document.getElementById('acctName').textContent = user.name;
  document.getElementById('acctEmail').textContent = user.email;
  document.getElementById('signOutBtn').addEventListener('click', () => { Store.signOut(); location.href = '/'; });

  const ordersWrap = document.getElementById('ordersWrap');
  const emptyState = '<p style="color:var(--muted);font-size:.9rem;">No orders yet. <a href="/shop/" class="text-link">Shop the systems</a></p>';

  /* Orders come from Supabase and are scoped to this customer by RLS. */
  async function renderOrders() {
    ordersWrap.innerHTML = '<p style="color:var(--muted);font-size:.9rem;">Finding your orders.</p>';
    try {
      const orders = await window.CrystalinaData.myOrders();
      if (!orders.length) { ordersWrap.innerHTML = emptyState; return; }
      ordersWrap.innerHTML = orders.map(o => `
        <div class="order-card">
          <div class="order-head">
            <strong>Order ${escapeHTML(o.id)}</strong>
            <span class="status-pill status-${escapeHTML(o.status)}">${escapeHTML(orderStatusLabel(o.status))}</span>
          </div>
          <div style="font-size:.82rem;color:var(--muted);margin-bottom:8px;">${new Date(o.date).toLocaleDateString('en-US', { dateStyle: 'medium' })} &middot; ${o.items.reduce((n, i) => n + i.qty, 0)} item(s) &middot; ${money(o.total)}</div>
          <div style="font-size:.84rem;">${o.items.map(i => `${escapeHTML(i.name)} &times; ${i.qty}`).join('<br>')}</div>
          <p style="margin-top:10px;"><a class="text-link" href="/order/?id=${encodeURIComponent(o.dbId)}">View receipt</a></p>
        </div>`).join('');
    } catch (error) {
      console.error('[account] order load failed', error);
      ordersWrap.innerHTML = '<p style="color:var(--muted);font-size:.9rem;">We could not load your orders just now. Please refresh, or contact us if it continues.</p>';
    }
  }
  renderOrders();

</script>
</body>
</html>
