<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Water Filters | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="page-hero">
    <div class="container">
      <h1>Shop Filtration Systems</h1>
      <p>Every system is specced for New York City water. Free delivery in the five boroughs on orders over $99.</p>
    </div>
  </section>

  <section class="section">
    <div class="container shop-layout">
      <aside class="shop-sidebar">
        <h4>Categories</h4>
        <div class="cat-filter" id="catFilter"></div>
      </aside>
      <div>
        <div class="shop-toolbar">
          <label class="sr-only" for="searchInput">Search products</label>
          <input type="search" id="searchInput" placeholder="Search products…">
          <label class="sr-only" for="sortSelect">Sort products</label>
          <select id="sortSelect">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </div>
        <div class="shop-grid" id="shopGrid"></div>
        <div class="shop-empty" id="shopEmpty" style="display:none">
          <h3>No products found</h3>
          <p>Try a different search or category.</p>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js"></script>
<script src="/js/store.js"></script>
<script src="/js/main.js"></script>
<script>
  initPage('/shop/');

  const params = new URLSearchParams(location.search);
  let activeCat = params.get('cat') || 'All';
  let query = '';
  let sort = 'featured';

  const cats = ['All', ...new Set(Store.getProducts().map(p => p.category))];
  const catFilter = document.getElementById('catFilter');

  function renderCats() {
    catFilter.innerHTML = cats.map(c =>
      `<button class="${c === activeCat ? 'active' : ''}" data-cat="${c}">${c}</button>`).join('');
    catFilter.querySelectorAll('button').forEach(b =>
      b.addEventListener('click', () => { activeCat = b.dataset.cat; renderCats(); renderGrid(); }));
  }

  function renderGrid() {
    let list = Store.getProducts().filter(p =>
      (activeCat === 'All' || p.category === activeCat) &&
      (!query || (p.name + ' ' + p.short + ' ' + p.category).toLowerCase().includes(query)));
    if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
    if (sort === 'rating') list.sort((a, b) => b.rating - a.rating);
    document.getElementById('shopGrid').innerHTML = list.map(productCard).join('');
    document.getElementById('shopEmpty').style.display = list.length ? 'none' : 'block';
    bindAddButtons();
  }

  document.getElementById('searchInput').addEventListener('input', e => { query = e.target.value.toLowerCase(); renderGrid(); });
  document.getElementById('sortSelect').addEventListener('change', e => { sort = e.target.value; renderGrid(); });

  renderCats();
  renderGrid();
</script>
</body>
</html>
