<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Enter your email and we’ll send a six-digit verification code.</p>
      <div class="auth-tabs" id="customerTabs">
        <button id="tabSignin" class="active">Sign In</button>
        <button id="tabSignup">Create Account</button>
      </div>
      <div class="form-error" id="authError" role="alert" aria-live="polite"></div>

      <form id="authForm">
        <div class="field">
          <label for="aEmail">Email</label>
          <input id="aEmail" type="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Send Verification Code</button>
      </form>

      <form id="codeForm" hidden>
        <div class="field"><label for="aCode">Six-digit verification code</label><input id="aCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="123456"></div>
        <button type="submit" class="btn btn-primary btn-block">Verify &amp; Continue</button>
        <button type="button" class="btn btn-ghost btn-block" id="changeEmail">Use another email</button>
      </form>

      <p class="auth-alt" id="modeToggle">Crystalina staff? <button type="button" class="link auth-mode-link" id="staffLink">Staff sign in →</button></p>

    </div>
  </div>
</main>

<script src="/js/store.js"></script>
<script src="/js/main.js"></script>
<script src="/js/auth.js"></script>
<script>
  initPage('');

  let mode = 'signin';
  let staffMode = new URLSearchParams(location.search).get('mode') === 'staff';
  let pendingEmail = '';
  const staffRoutes = { admin: '/admin/', manager: '/manager/', technician: '/technician/', sales: '/sales/' };
  const staffRolePriority = ['admin', 'manager', 'technician', 'sales'];

  const el = id => document.getElementById(id);
  const err = el('authError');

  function refresh() {
    el('tabSignin').classList.toggle('active', mode === 'signin');
    el('tabSignup').classList.toggle('active', mode === 'signup');
    el('authSubmit').textContent = 'Send verification code';
    el('authTitle').textContent = staffMode ? 'Staff sign in' : (mode === 'signin' ? 'Welcome back' : 'Create your account');
    el('authSub').textContent = staffMode
      ? 'Enter your staff email. We’ll detect your assigned dashboards after verification.'
      : (mode === 'signin' ? 'Enter your email and we’ll send a six-digit verification code.' : 'Create an account with a six-digit verification code sent to your email.');
    el('modeToggle').innerHTML = staffMode
      ? 'Customer? <button type="button" class="link auth-mode-link" id="staffLink">Back to customer sign in →</button>'
      : 'Crystalina staff? <button type="button" class="link auth-mode-link" id="staffLink">Staff sign in →</button>';
    document.getElementById('staffLink').addEventListener('click', () => { staffMode = !staffMode; if (staffMode) mode = 'signin'; refresh(); });
    el('customerTabs').style.display = staffMode ? 'none' : '';
    err.classList.remove('show');
  }

  el('tabSignin').addEventListener('click', () => { mode = 'signin'; refresh(); });
  el('tabSignup').addEventListener('click', () => { mode = 'signup'; refresh(); });

  el('authForm').addEventListener('submit', async e => {
    e.preventDefault();
    err.classList.remove('show');
    pendingEmail = el('aEmail').value.trim();
    const submit = el('authSubmit');
    try {
      const auth = await window.CrystalinaAuth;
      submit.disabled = true; submit.textContent = 'Sending code…';
      await auth.sendCode(pendingEmail, { allowSignup: !staffMode && mode === 'signup' });
      el('authForm').hidden = true; el('codeForm').hidden = false; el('aCode').focus();
    } catch (error) { err.textContent = error.message || 'Unable to send a verification code.'; err.classList.add('show'); }
    finally { submit.disabled = false; submit.textContent = 'Send verification code'; }
  });

  el('codeForm').addEventListener('submit', async e => {
    e.preventDefault(); err.classList.remove('show');
    try {
      const auth = await window.CrystalinaAuth;
      const user = await auth.verifyCode(pendingEmail, el('aCode').value.trim());
      if (staffMode) {
        const primaryRole = staffRolePriority.find(role => user.roles.includes(role));
        if (!primaryRole) { await auth.signOut(); throw new Error('This account does not have staff dashboard access. Contact a Crystalina administrator.'); }
        Store.setCurrentUser(user);
        location.href = staffRoutes[primaryRole];
      } else { Store.setCurrentUser(user); location.href = '/account/'; }
    } catch (error) { err.textContent = error.message || 'That verification code is invalid or expired.'; err.classList.add('show'); }
  });
  el('changeEmail').addEventListener('click', () => { el('codeForm').hidden = true; el('authForm').hidden = false; el('aCode').value = ''; });

  refresh();
</script>
</body>
</html>
