<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=20261102-type-rule">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="authTitle">Sign in</h1>
      <p class="auth-sub" id="authSub">Your email, and we send an eight-digit code.</p>
      <div class="auth-tabs" id="customerTabs">
        <button id="tabSignin" class="active" type="button">Sign in</button>
        <button id="tabSignup" type="button">Create an account</button>
      </div>
      <div class="form-error" id="authError" role="alert" aria-live="polite"></div>

      <button type="button" class="btn btn-outline btn-block btn-google" id="googleSignIn">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.41 5.41 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span id="googleLabel">Continue with Google</span>
      </button>

      <p class="auth-or"><span>or</span></p>

      <form id="authForm">
        <div class="field">
          <label for="aEmail">Email</label>
          <input id="aEmail" type="email" required placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Send the code</button>
      </form>

      <form id="codeForm" hidden>
        <div class="field"><label for="aCode">Eight-digit verification code</label><input id="aCode" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="one-time-code" required placeholder="12345678"></div>
        <p class="verification-help" id="codeStatus" role="status" aria-live="polite">Codes expire after 60 seconds.</p>
        <div class="code-actions">
          <button type="submit" class="btn btn-primary btn-block">Continue</button>
          <button type="button" class="btn btn-outline btn-block" id="resendCode" disabled>Send a new code in 60s</button>
          <button type="button" class="btn btn-ghost btn-block" id="changeEmail">Use another email</button>
        </div>
      </form>

      <p class="auth-alt" id="modeToggle">Crystalina staff? <button type="button" class="link auth-mode-link" id="staffLink">Staff sign in</button></p>

    </div>
  </div>
</main>

<script src="/js/product-catalog.js?v=20261103-redesign"></script>
<script src="/js/supabase-client.js?v=20261103-redesign"></script>
<script src="/js/data-remote.js?v=20261103-redesign"></script>
<script src="/js/store.js?v=20261103-redesign"></script>
<script src="/js/main.js?v=20261103-redesign"></script>
<script src="/js/auth.js?v=20261103-redesign"></script>
<script>
  initPage('');

  let mode = 'signin';
  let staffMode = new URLSearchParams(location.search).get('mode') === 'staff';
  let pendingEmail = '';
  let pendingAllowSignup = false;
  let pendingStaffMode = staffMode;
  let resendTimer = null;
  let resendDeadline = 0;
  const staffRoutes = { admin: '/admin/', manager: '/manager/', technician: '/technician/', sales: '/sales/' };
  const staffRolePriority = ['admin', 'manager', 'technician', 'sales'];

  const el = id => document.getElementById(id);
  const err = el('authError');

  function updateResendState() {
    const remaining = Math.max(0, Math.ceil((resendDeadline - Date.now()) / 1000));
    el('resendCode').disabled = remaining > 0;
    el('resendCode').textContent = remaining > 0 ? `Resend Verification Code in ${remaining}s` : 'Resend Verification Code';
    if (!remaining && resendTimer) { clearInterval(resendTimer); resendTimer = null; }
  }

  function startResendTimer(message = 'Verification code sent. It expires after 60 seconds.') {
    if (resendTimer) clearInterval(resendTimer);
    resendDeadline = Date.now() + 60000;
    el('codeStatus').textContent = message;
    updateResendState();
    resendTimer = setInterval(updateResendState, 250);
  }

  function stopResendTimer() {
    if (resendTimer) clearInterval(resendTimer);
    resendTimer = null; resendDeadline = 0;
  }

  function refresh() {
    el('tabSignin').classList.toggle('active', mode === 'signin');
    el('tabSignup').classList.toggle('active', mode === 'signup');
    el('authSubmit').textContent = 'Send the code';
    el('authTitle').textContent = staffMode ? 'Staff sign in' : (mode === 'signin' ? 'Sign in' : 'Create an account');
    el('authSub').textContent = staffMode
      ? 'Your staff email, and we send an eight-digit code. Your dashboards open once it is checked.'
      : (mode === 'signin' ? 'Your email, and we send an eight-digit code.' : 'Your email, and we send an eight-digit code to open the account.');
    el('modeToggle').innerHTML = staffMode
      ? 'Customer? <button type="button" class="link auth-mode-link" id="staffLink">Back to customer sign in</button>'
      : 'Crystalina staff? <button type="button" class="link auth-mode-link" id="staffLink">Staff sign in</button>';
    document.getElementById('staffLink').addEventListener('click', () => { staffMode = !staffMode; if (staffMode) mode = 'signin'; refresh(); });
    el('customerTabs').style.display = staffMode ? 'none' : '';
    err.classList.remove('show');
  }

  el('tabSignin').addEventListener('click', () => { mode = 'signin'; refresh(); });
  el('tabSignup').addEventListener('click', () => { mode = 'signup'; refresh(); });

  el('authForm').addEventListener('submit', async e => {
    e.preventDefault();
    err.classList.remove('show');
    pendingEmail = el('aEmail').value.trim();
    pendingAllowSignup = !staffMode && mode === 'signup';
    pendingStaffMode = staffMode;
    const submit = el('authSubmit');
    try {
      const auth = await window.CrystalinaAuth;
      submit.disabled = true; submit.textContent = 'Sending the code';
      await auth.sendCode(pendingEmail, { allowSignup: pendingAllowSignup });
      el('authForm').hidden = true; el('codeForm').hidden = false; el('modeToggle').hidden = true;
      startResendTimer(); el('aCode').focus();
    } catch (error) { err.textContent = error.message || 'Unable to send a verification code.'; err.classList.add('show'); }
    finally { submit.disabled = false; submit.textContent = 'Send the code'; }
  });

  el('codeForm').addEventListener('submit', async e => {
    e.preventDefault(); err.classList.remove('show');
    try {
      const auth = await window.CrystalinaAuth;
      const user = await auth.verifyCode(pendingEmail, el('aCode').value.trim());
      await routeAfterSignIn(auth, user, pendingStaffMode);
    } catch (error) { err.textContent = error.message || 'That verification code is invalid or expired.'; err.classList.add('show'); }
  });
  el('resendCode').addEventListener('click', async () => {
    if (Date.now() < resendDeadline) return;
    err.classList.remove('show');
    const button = el('resendCode');
    try {
      button.disabled = true; button.textContent = 'Sending a new code';
      const auth = await window.CrystalinaAuth;
      await auth.sendCode(pendingEmail, { allowSignup: pendingAllowSignup });
      el('aCode').value = '';
      startResendTimer('A new verification code was sent. It expires after 60 seconds.');
      el('aCode').focus();
    } catch (error) { err.textContent = error.message || 'Unable to resend the verification code.'; err.classList.add('show'); updateResendState(); }
  });
  el('changeEmail').addEventListener('click', () => {
    stopResendTimer(); el('codeForm').hidden = true; el('authForm').hidden = false;
    el('modeToggle').hidden = false; el('aCode').value = ''; el('aEmail').focus();
  });

  /* One place that decides where a signed-in person lands, used by the
     code form and by the return from Google. Two copies of this would
     drift the day staff routing changes. */
  async function routeAfterSignIn(auth, user, asStaff) {
    if (asStaff) {
      const primaryRole = staffRolePriority.find(role => user.roles.includes(role));
      if (!primaryRole) {
        await auth.signOut();
        throw new Error('This account does not have staff dashboard access. Contact a Crystalina administrator.');
      }
      Store.setCurrentUser(user);
      location.href = staffRoutes[primaryRole];
      return;
    }
    Store.setCurrentUser(user);
    location.href = '/account/';
  }

  el('googleSignIn').addEventListener('click', async () => {
    err.classList.remove('show');
    const button = el('googleSignIn');
    try {
      button.disabled = true;
      el('googleLabel').textContent = 'Opening Google';
      const auth = await window.CrystalinaAuth;
      await auth.signInWithGoogle({ next: staffMode ? 'staff' : null });
      /* The browser leaves for Google here, so nothing below runs on the
         happy path. It only returns if the redirect was refused. */
    } catch (error) {
      err.textContent = error.message || 'Unable to start Google sign in.';
      err.classList.add('show');
      button.disabled = false;
      el('googleLabel').textContent = 'Continue with Google';
    }
  });

  /* Coming back from Google. detectSessionInUrl has already consumed the
     token out of the URL by the time the SDK resolves, so the only
     question left is whether there is a session. */
  (async () => {
    const returning = new URLSearchParams(location.search).get('next') !== null
      || location.hash.includes('access_token')
      || location.search.includes('code=');
    if (!returning) return;
    try {
      const auth = await window.CrystalinaAuth;
      const user = await auth.currentUser();
      if (!user) return;
      const asStaff = new URLSearchParams(location.search).get('next') === 'staff';
      await routeAfterSignIn(auth, user, asStaff);
    } catch (error) {
      err.textContent = error.message || 'We could not complete that sign in.';
      err.classList.add('show');
    }
  })();

  refresh();
</script>
</body>
</html>
