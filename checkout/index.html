<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="page-hero">
    <div class="container"><h1>Checkout</h1><p>Secure checkout is being configured. Orders cannot be placed until payments and inventory are connected.</p></div>
  </section>

  <section class="section">
    <div class="container">
      <div class="checkout-layout" id="checkoutLayout">
        <div class="panel">
          <h3>Shipping Details</h3>
          <div class="form-error" id="coError"></div>
          <form id="checkoutForm">
            <div class="field-row">
              <div class="field"><label>First name</label><input required id="fFirst"></div>
              <div class="field"><label>Last name</label><input required id="fLast"></div>
            </div>
            <div class="field"><label>Email</label><input type="email" required id="fEmail"></div>
            <div class="field"><label>Phone</label><input type="tel" id="fPhone" placeholder="(929) 555-0123"></div>
            <div class="field"><label>Street address</label><input required id="fAddr" placeholder="Apt / unit included"></div>
            <div class="field-row">
              <div class="field"><label>Borough / City</label>
                <select id="fBorough">
                  <option>Manhattan</option><option>Brooklyn</option><option>Queens</option>
                  <option>The Bronx</option><option>Staten Island</option><option>Other (NY metro)</option>
                </select>
              </div>
              <div class="field"><label>ZIP code</label><input required id="fZip" pattern="\d{5}"></div>
            </div>
            <div class="field"><label>Add professional installation?</label>
              <select id="fInstall">
                <option value="no">No, I'll install it myself</option>
                <option value="yes">Yes, contact me to schedule (+$89, billed later)</option>
              </select>
            </div>
            <h3 style="margin:22px 0 14px">Payment</h3>
            <p style="font-size:.85rem;color:var(--muted);background:var(--ice-50);border:1px solid var(--silver);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;">
              <span class="ic" style="width:20px;height:20px;flex:none;color:var(--blue-500);margin-top:1px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.4"/><path d="M3 10h18"/></svg></span>
              <span>Payments and inventory are being connected securely. Ordering is temporarily unavailable while this work is completed.</span></p>
            <button type="submit" class="btn btn-primary btn-block" disabled>Checkout unavailable</button>
          </form>
        </div>
        <div class="panel">
          <h3>Order Summary</h3>
          <div id="summaryItems"></div>
          <div id="summaryTotals"></div>
        </div>
      </div>
      <div class="order-success" id="orderSuccess" style="display:none"></div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/data-remote.js"></script>
<script src="/js/store.js"></script>
<script src="/js/main.js"></script>
<script>
  initPage('');

  const user = Store.currentUser();
  if (user) {
    const [first, ...rest] = user.name.split(' ');
    document.getElementById('fFirst').value = first;
    document.getElementById('fLast').value = rest.join(' ');
    document.getElementById('fEmail').value = user.email;
  }

  function renderSummary() {
    const { items, subtotal } = Store.cartDetails();
    const layout = document.getElementById('checkoutLayout');
    if (!items.length && document.getElementById('orderSuccess').style.display === 'none') {
      layout.innerHTML = `<div class="panel" style="grid-column:1/-1;text-align:center;padding:60px;">
        <h3>Your cart is empty</h3>
        <p style="color:var(--muted);margin:10px 0 22px;">Add a filtration system before checking out.</p>
        <a href="/shop/" class="btn btn-primary">Shop Filters</a></div>`;
      return;
    }
    const shipping = subtotal >= 99 ? 0 : 9.99;
    const tax = subtotal * 0.08875;
    document.getElementById('summaryItems').innerHTML = items.map(i => `
      <div class="summary-line">
        <span style="display:flex;gap:10px;align-items:center;">
          <img src="${i.product.image}" style="width:42px;height:42px;border-radius:8px;object-fit:cover;">
          ${i.product.name} × ${i.qty}
        </span>
        <strong>${money(i.product.price * i.qty)}</strong>
      </div>`).join('');
    document.getElementById('summaryTotals').innerHTML = `
      <div class="summary-line"><span>Subtotal</span><span>${money(subtotal)}</span></div>
      <div class="summary-line"><span>Shipping</span><span>${shipping === 0 ? 'FREE' : money(shipping)}</span></div>
      <div class="summary-line"><span>NYC sales tax (8.875%)</span><span>${money(tax)}</span></div>
      <div class="summary-total"><span>Total</span><span>${money(subtotal + shipping + tax)}</span></div>`;
  }

  document.getElementById('checkoutForm').addEventListener('submit', e => {
    e.preventDefault();
    const order = Store.placeOrder({
      name: `${document.getElementById('fFirst').value} ${document.getElementById('fLast').value}`.trim(),
      email: document.getElementById('fEmail').value,
      phone: document.getElementById('fPhone').value,
      address: document.getElementById('fAddr').value,
      borough: document.getElementById('fBorough').value,
      zip: document.getElementById('fZip').value,
      installation: document.getElementById('fInstall').value === 'yes',
      userId: user ? user.id : null
    });
    if (!order) return;
    document.getElementById('checkoutLayout').style.display = 'none';
    const s = document.getElementById('orderSuccess');
    s.style.display = 'block';
    s.innerHTML = `
      <div class="big-check">✓</div>
      <h2>Thank you! Order ${order.id} confirmed.</h2>
      <p style="color:var(--muted);margin:12px 0 8px;">A confirmation email will be sent to <strong>${order.customer.email}</strong>.
      Total charged: <strong>${money(order.total)}</strong>.</p>
      ${order.customer.installation ? `<p style="color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center;">${icon('wrench')} Our installation team will call you within 1 business day to schedule.</p>` : ''}
      <div style="display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap;">
        <a href="/shop/" class="btn btn-primary">Continue Shopping</a>
        <a href="/account/" class="btn btn-outline">View My Orders</a>
      </div>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  document.addEventListener('cart:changed', renderSummary);
  renderSummary();
</script>
</body>
</html>
