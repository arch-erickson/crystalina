<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Your Filter | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=20261102-type-rule">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main id="main">
  <section class="page-hero page-hero--quiet">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><span>Find your filter</span></nav>
      <h1>Find your filter</h1>
      <p>Five questions about your home, and the system that fits it. Under a minute.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="quiz-card" id="quizCard" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js?v=20261103-redesign"></script>
<script src="/js/supabase-client.js?v=20261103-redesign"></script>
<script src="/js/data-remote.js?v=20261103-redesign"></script>
<script src="/js/store.js?v=20261103-redesign"></script>
<script src="/js/main.js?v=20261103-redesign"></script>
<script>
  initPage('/quiz/');

  const QUESTIONS = [
    { q: 'Do you rent or own your home?', opts: [
      { ic: 'building', t: 'I rent, and cannot touch the plumbing', tag: 'rent' },
      { ic: 'building', t: 'I rent, and a small fitting is fine', tag: 'rent-flex' },
      { ic: 'home', t: 'I own an apartment, co-op or condo', tag: 'own' },
      { ic: 'townhouse', t: 'I own a brownstone, townhouse or house', tag: 'house' }]},
    { q: 'How old is your building?', opts: [
      { ic: 'shield', t: 'Before 1961', tag: 'old' },
      { ic: 'clock', t: '1961 to 1990', tag: 'mid' },
      { ic: 'check', t: 'After 1990', tag: 'new' },
      { ic: 'chat', t: "Not sure", tag: 'old' }]},
    { q: 'What matters most?', opts: [
      { ic: 'purity', t: 'Drinking water: lead, PFAS, microplastics', tag: 'purity' },
      { ic: 'shower', t: 'Softer skin and hair in the shower', tag: 'shower' },
      { ic: 'shield', t: 'The whole home, appliances included', tag: 'whole' },
      { ic: 'tag', t: 'Better taste, for less', tag: 'budget' }]},
    { q: 'How many people drink at home?', opts: [
      { ic: 'droplet', t: 'Just me', tag: 'small' }, { ic: 'users', t: '2 to 3 people', tag: 'med' },
      { ic: 'users', t: '4 to 5 people', tag: 'large' }, { ic: 'users', t: '6 or more', tag: 'large' }]},
    { q: 'What would you put towards it?', opts: [
      { ic: 'tag', t: 'Under $50', tag: 'b1' }, { ic: 'tag', t: '$50 to $200', tag: 'b2' },
      { ic: 'card', t: '$200 to $400', tag: 'b3' }, { ic: 'sparkle', t: '$400 or more', tag: 'b4' }]}
  ];

  const card = document.getElementById('quizCard');
  let step = 0;
  const answers = [];

  /* Catalog-driven matching.
     Nothing here is hard-coded to a product id: every recommendation is scored
     from live catalog attributes, so new products are eligible the moment they
     are published in Supabase, and retired products simply stop scoring. */
  const BUDGET_CEILINGS = { b1: 50, b2: 200, b3: 400, b4: Infinity };

  function budgetCeiling() {
    const tag = answers.find(a => BUDGET_CEILINGS[a] !== undefined);
    return tag ? BUDGET_CEILINGS[tag] : Infinity;
  }

  function textOf(product) {
    return [product.name, product.short, product.category, (product.specs || []).join(' ')]
      .join(' ').toLowerCase();
  }

  function scoreProduct(product, has, ceiling) {
    // Only recommend something a shopper can actually buy.
    if (product.published === false) return -1;
    if (product.productKind === 'replacement_filter') return -1;
    if (typeof product.stock === 'number' && product.stock <= 0) return -1;

    const text = textOf(product);
    let score = 1;

    // Budget: reward a fit, penalise (without excluding) an overshoot.
    if (product.price <= ceiling) score += 6;
    else if (ceiling !== Infinity) score -= Math.min(6, (product.price - ceiling) / Math.max(ceiling, 1) * 4);

    // Stated priority.
    if (has('shower') && /shower|bath/.test(text)) score += 8;
    if (has('whole') && /whole|house|home system/.test(text)) score += 8;
    if (has('purity') && /(reverse osmosis|ro|uv|alkaline|membrane)/.test(text)) score += 6;
    if (has('budget')) score += Math.max(0, 4 - product.price / 250);

    // Housing type.
    if ((has('rent') || has('rent-flex')) && /countertop|pitcher|faucet|no installation|tankless/.test(text)) score += 5;
    if (has('rent') && (product.installationMinutes || 0) > 60) score -= 4;
    if (has('house') && /whole|high-flow|600/.test(text)) score += 3;

    // Building age: older plumbing benefits from the most thorough treatment.
    if (has('old') && /(reverse osmosis|uv|membrane)/.test(text)) score += 3;

    // Household size favours higher throughput.
    if (has('large') && /(600|high-flow|tankless)/.test(text)) score += 3;
    if (has('small') && /(400|compact)/.test(text)) score += 2;

    // Prefer complete systems over accessories when a system is wanted.
    if (product.productKind === 'system') score += 2;
    if (product.productKind === 'filter_bundle' && !has('budget')) score -= 2;

    return score;
  }

  function pickProduct() {
    const has = t => answers.includes(t);
    const ceiling = budgetCeiling();
    const ranked = Store.getProducts()
      .map(product => ({ product, score: scoreProduct(product, has, ceiling) }))
      .filter(entry => entry.score >= 0)
      .sort((a, b) => b.score - a.score || a.product.price - b.product.price);
    return ranked.length ? ranked[0].product : null;
  }

  function render() {
    if (step < QUESTIONS.length) {
      const { q, opts } = QUESTIONS[step];
      card.innerHTML = `
        <div class="quiz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${step}" aria-label="Question ${step + 1} of ${QUESTIONS.length}"><div style="width:${(step + 1) / (QUESTIONS.length + 1) * 100}%"></div></div>
        <p class="quiz-step">Question ${step + 1} of ${QUESTIONS.length}</p>
        <h2 class="quiz-q" id="quizQuestion" tabindex="-1">${q}</h2>
        <div class="quiz-opts" role="group" aria-labelledby="quizQuestion">${opts.map((o, i) => `<button data-i="${i}"><span class="quiz-opt-ic">${svgIcon(o.ic)}</span><span>${o.t}</span></button>`).join('')}</div>
        ${step > 0 ? '<p class="quiz-back"><button type="button" class="text-link" id="quizBack">Back</button></p>' : ''}`;
      if (step > 0) document.getElementById('quizQuestion').focus({ preventScroll: false });
      card.querySelectorAll('.quiz-opts button').forEach(b =>
        b.addEventListener('click', () => { answers[step] = opts[b.dataset.i].tag; step++; render(); }));
      const back = document.getElementById('quizBack');
      if (back) back.addEventListener('click', () => { step--; answers.length = step; render(); });
    } else {
      const p = pickProduct() || Store.getProducts()[0];
      // Be straight with the shopper when the closest match is above the
      // budget they picked, rather than quietly recommending past it.
      const ceiling = budgetCeiling();
      const overBudget = p && ceiling !== Infinity && p.price > ceiling;
      if (!p) { card.innerHTML = '<h2 class="quiz-q">The catalogue is loading</h2><p class="quiz-note">Try again in a moment, or <a class="link" href="/shop/">see every system</a>.</p>'; return; }
      card.innerHTML = `
        <div class="quiz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}" aria-valuenow="${QUESTIONS.length}" aria-label="Finished"><div style="width:100%"></div></div>
        <p class="quiz-step">For your home</p>
        <h2 class="quiz-q" id="quizQuestion" tabindex="-1">${escapeHTML(p.name)}</h2>
        <div class="quiz-result">
          <img src="${escapeHTML(p.image)}" alt="${escapeHTML(p.name)}">
          <div>
            <p class="quiz-note">${escapeHTML(p.short)}</p>
            <p class="quiz-price">${money(p.price)}${p.comparePrice ? ` <span>${money(p.comparePrice)}</span>` : ''}</p>
          </div>
        </div>
        <div class="quiz-actions">
          <button class="btn btn-primary" id="quizAdd">Add to Cart</button>
          <a class="btn btn-outline" href="/product/?id=${encodeURIComponent(p.id)}">See the system</a>
          <button type="button" class="text-link" id="quizRestart">Start again</button>
        </div>
        ${overBudget ? `<p class="quiz-note quiz-note--rule">This is the closest fit we stock, and it sits above the figure you gave. <a class="link" href="/shop/">See every system</a>, or ask us.</p>` : ''}
        <p class="quiz-note quiz-note--rule">Not sure? <a class="link" href="https://wa.me/19178094803" target="_blank" rel="noopener">Message us on WhatsApp</a> and someone here will help you choose.</p>`;
      document.getElementById('quizAdd').addEventListener('click', () => { Store.addToCart(p.id); toast('Added to cart'); openCart(); });
      document.getElementById('quizRestart').addEventListener('click', () => { step = 0; answers.length = 0; render(); });
    }
  }
  render();
  // Re-run the match when the live Supabase catalog lands.
  document.addEventListener('catalog:changed', () => { if (step >= QUESTIONS.length) render(); });
</script>
</body>
</html>
