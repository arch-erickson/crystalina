<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your order | Crystalina</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=20261102-type-rule">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="page-hero page-hero--quiet">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><a href="/account/">Account</a><span>/</span><span>Order</span></nav>
      <h1 id="orderTitle">Your order</h1>
      <p id="orderLead">The receipt for an order, with everything in it and where it is going.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="receipt" id="receipt" aria-live="polite"></div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js?v=20261103-redesign"></script>
<script src="/js/supabase-client.js?v=20261103-redesign"></script>
<script src="/js/data-remote.js?v=20261103-redesign"></script>
<script src="/js/store.js?v=20261103-redesign"></script>
<script src="/js/main.js?v=20261103-redesign"></script>
<script>
  initPage('/account/');

  /* The receipt is read from the order itself, scoped to the signed-in
     customer by row level security. Nothing here is computed in the
     browser: every figure is the one the database wrote. */
  const receipt = document.getElementById('receipt');
  const id = new URLSearchParams(location.search).get('id');

  function notice(title, body, actions) {
    receipt.innerHTML = `<div class="receipt-notice"><h2>${title}</h2><p>${body}</p><div class="notice-actions">${actions}</div></div>`;
  }

  function addressLines(a) {
    if (!a || typeof a !== 'object') return '';
    return [a.name, a.line1, a.line2, [a.city, a.state, a.zip].filter(Boolean).join(', '), a.phone]
      .filter(Boolean).map(escapeHTML).join('<br>');
  }

  async function render() {
    const user = Store.currentUser();
    if (!user) {
      notice('Sign in to see this receipt', 'Orders belong to the account that placed them.',
        `<a class="btn btn-primary" href="/signin/?next=${encodeURIComponent(location.pathname + location.search)}">Sign in</a>`);
      return;
    }
    if (!id) {
      notice('Which order?', 'Open a receipt from your account, where every order is listed.',
        `<a class="btn btn-primary" href="/account/">Go to my account</a>`);
      return;
    }
    receipt.innerHTML = '<p class="receipt-loading">Finding your order.</p>';
    let order = null;
    try { order = await window.CrystalinaData.myOrder(id); }
    catch (error) { console.error('[order] load failed', error); }
    if (!order) {
      notice('We could not find that order', 'It may belong to another account, or the address may be incomplete.',
        `<a class="btn btn-primary" href="/account/">Go to my account</a><a class="text-link" href="/contact/">Or ask us</a>`);
      return;
    }

    document.getElementById('orderTitle').textContent = 'Order ' + order.id;
    document.getElementById('orderLead').textContent = 'Placed ' + new Date(order.date).toLocaleDateString('en-US', { dateStyle: 'long' }) + '.';
    document.title = 'Order ' + order.id + ' | Crystalina';

    receipt.innerHTML = `
      <div class="receipt-head">
        <div>
          <span class="eyebrow">Receipt</span>
          <h2>Order ${escapeHTML(order.id)}</h2>
          <p class="receipt-meta">${new Date(order.date).toLocaleDateString('en-US', { dateStyle: 'long' })} &middot; <span class="status-pill status-${escapeHTML(order.status)}">${escapeHTML(orderStatusLabel(order.status))}</span></p>
        </div>
        <div class="receipt-actions">
          <button type="button" class="btn btn-outline btn-sm" id="printBtn">Print or save</button>
          <a class="btn btn-ghost btn-sm" href="/account/">All orders</a>
        </div>
      </div>
      <table class="receipt-table">
        <thead><tr><th>Item</th><th>Each</th><th>Qty</th><th>Line</th></tr></thead>
        <tbody>
          ${order.items.map(i => `<tr><td>${escapeHTML(i.name)}</td><td>${money(i.price)}</td><td>${i.qty}</td><td>${money(i.price * i.qty)}</td></tr>`).join('')}
        </tbody>
      </table>
      <div class="receipt-grid">
        <div>
          <h3>Delivery</h3>
          <p class="receipt-address">${addressLines(order.address) || 'As given at checkout.'}</p>
          ${order.installation ? '<p class="receipt-note">Installation by our own team, requested with this order.</p>' : ''}
        </div>
        <dl class="receipt-totals">
          <dt>Subtotal</dt><dd>${money(order.subtotal)}</dd>
          <dt>Delivery</dt><dd>${order.shipping ? money(order.shipping) : 'Free'}</dd>
          <dt>Sales tax</dt><dd>${money(order.tax)}</dd>
          <dt class="receipt-total">Total</dt><dd class="receipt-total">${money(order.total)}</dd>
        </dl>
      </div>
      <div class="receipt-history" id="orderHistory"></div>
      <p class="receipt-foot">Questions about this order: <a class="link" href="/contact/">contact us</a> and quote the order number.</p>`;
    document.getElementById('printBtn').addEventListener('click', () => window.print());
    renderHistory(order);
  }

  /* Where the order has been. The trail is written by the database on
     every move; a row whose from and to agree is a note against the
     order, not a move. The placing of the order opens the list. */
  async function renderHistory(order) {
    const wrap = document.getElementById('orderHistory');
    let events = [];
    try { events = await window.CrystalinaData.orderHistory(order.dbId); }
    catch (error) { console.warn('[order] history unavailable', error); }
    const when = value => new Date(value).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const rows = [{ label: 'Order placed', at: order.date, note: '' }]
      .concat(events.map(e => ({ label: e.from === e.to ? 'Note' : orderStatusLabel(e.to), at: e.at, note: e.note || '' })));
    wrap.innerHTML = `<h3>Where it is</h3>
      <ol class="timeline">${rows.map((r, i) => `<li class="${i === rows.length - 1 ? 'is-now' : ''}"><time datetime="${escapeHTML(r.at)}">${escapeHTML(when(r.at))}</time><strong>${escapeHTML(r.label)}</strong>${r.note ? `<p>${escapeHTML(r.note)}</p>` : ''}</li>`).join('')}</ol>`;
  }
  render();
</script>
</body>
</html>
