<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=4">
<link rel="icon" href="favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="manifest" href="site.webmanifest">
</head>
<body>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p class="auth-sub" id="authSub">Sign in to track orders and manage filter reminders.</p>
      <div class="auth-tabs">
        <button id="tabSignin" class="active">Sign In</button>
        <button id="tabSignup">Create Account</button>
      </div>
      <div class="form-error" id="authError"></div>

      <form id="authForm">
        <div class="field" id="nameField" style="display:none">
          <label>Full name</label>
          <input id="aName" placeholder="Jane Rivera">
        </div>
        <div class="field">
          <label>Email</label>
          <input id="aEmail" type="email" required placeholder="you@example.com">
        </div>
        <div class="field">
          <label>Password</label>
          <input id="aPass" type="password" required minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Sign In</button>
      </form>

      <p class="auth-alt" id="modeToggle">Store administrator? <span class="link" id="adminLink">Admin sign in →</span></p>

      <div class="demo-creds" id="demoCreds" style="display:none">
        <strong>Demo admin credentials (first draft only):</strong><br>
        Email: admin@crystalinawater.com<br>
        Password: crystalina2026
      </div>
    </div>
  </div>
</main>

<script src="js/store.js"></script>
<script src="js/main.js"></script>
<script>
  initPage('');

  let mode = 'signin';               // signin | signup
  let adminMode = new URLSearchParams(location.search).get('mode') === 'admin';

  const el = id => document.getElementById(id);
  const err = el('authError');

  function refresh() {
    el('nameField').style.display = mode === 'signup' ? '' : 'none';
    el('aName').required = mode === 'signup';
    el('tabSignin').classList.toggle('active', mode === 'signin');
    el('tabSignup').classList.toggle('active', mode === 'signup');
    el('authSubmit').textContent = adminMode ? 'Sign In to Dashboard' : (mode === 'signin' ? 'Sign In' : 'Create Account');
    el('authTitle').textContent = adminMode ? 'Admin sign in' : (mode === 'signin' ? 'Welcome back' : 'Create your account');
    el('authSub').textContent = adminMode
      ? 'Restricted area — Crystalina staff only.'
      : (mode === 'signin' ? 'Sign in to track orders and manage filter reminders.' : 'Join the Crystalina Club for order tracking and filter reminders.');
    el('demoCreds').style.display = adminMode ? '' : 'none';
    el('modeToggle').innerHTML = adminMode
      ? 'Customer? <span class="link" id="adminLink">Back to customer sign in →</span>'
      : 'Store administrator? <span class="link" id="adminLink">Admin sign in →</span>';
    document.getElementById('adminLink').addEventListener('click', () => { adminMode = !adminMode; if (adminMode) mode = 'signin'; refresh(); });
    document.querySelector('.auth-tabs').style.display = adminMode ? 'none' : '';
    err.classList.remove('show');
  }

  el('tabSignin').addEventListener('click', () => { mode = 'signin'; refresh(); });
  el('tabSignup').addEventListener('click', () => { mode = 'signup'; refresh(); });

  el('authForm').addEventListener('submit', e => {
    e.preventDefault();
    err.classList.remove('show');
    const email = el('aEmail').value.trim();
    const pass = el('aPass').value;

    let res;
    if (mode === 'signup' && !adminMode) res = Store.signUp(el('aName').value.trim(), email, pass);
    else res = Store.signIn(email, pass);

    if (!res.ok) { err.textContent = res.error; err.classList.add('show'); return; }

    if (adminMode && res.user.role !== 'admin') {
      Store.signOut();
      err.textContent = 'This account does not have admin access.';
      err.classList.add('show');
      return;
    }
    location.href = res.user.role === 'admin' ? 'admin.html' : 'account.html';
  });

  refresh();
</script>
</body>
</html>
