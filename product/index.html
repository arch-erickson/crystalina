<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=20261102-type-rule">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="section" id="pdSection">
    <div class="container pd-layout" id="pdLayout"></div>
  </section>

  <section class="section pd-related">
    <div class="container">
      <div class="section-head section-head--row">
        <div>
          <span class="eyebrow">Also</span>
          <h2 id="relatedHeading">Also in this category</h2>
        </div>
        <a href="/shop/" class="text-link">View all systems</a>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<script src="/js/product-catalog.js?v=20261103-redesign"></script>
<script src="/js/supabase-client.js?v=20261103-redesign"></script>
<script src="/js/data-remote.js?v=20261103-redesign"></script><script src="/js/store.js?v=20261103-redesign"></script>
<script src="/js/main.js?v=20261103-redesign"></script>
<script>
  initPage('/shop/');

  const id = new URLSearchParams(location.search).get('id');
  const p = Store.getProduct(id);
  const layout = document.getElementById('pdLayout');

  if (!p) {
    layout.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 0;">
      <h1>Product not found</h1>
      <p style="color:var(--muted); margin:12px 0 24px;">It may have been removed from the catalog.</p>
      <a class="btn btn-primary" href="/shop/">Back to Shop</a></div>`;
  } else {
    document.title = p.name + ' | Crystalina';
    const completeSets = Store.getBundlesForSystem(p.id);
    const bundleComponents = p.productKind === 'filter_bundle' ? Store.getBundleComponents(p.id) : [];
    const completeSetMarkup = completeSets.map(bundle => `
      <aside class="pd-bundle-panel" aria-labelledby="bundle-${bundle.id}">
        <img class="pd-bundle-image" src="${bundle.image}" alt="${bundle.name}">
        <div class="pd-bundle-content">
          <span class="pd-bundle-label">Complete set for ${p.modelCode}</span>
          <h3 id="bundle-${bundle.id}">${bundle.name}</h3>
          <p>${bundle.short}</p>
          <p class="pd-fit-note">We check the membrane connector against the cartridge in your system before it ships.</p>
          <ul class="pd-bundle-list">${bundle.specs.map(item => `<li>${item}</li>`).join('')}</ul>
          <div class="pd-bundle-footer">
            <div><strong>${money(bundle.price)}</strong>${bundle.comparePrice ? `<span>${money(bundle.comparePrice)}</span>` : ''}</div>
            <div class="pd-bundle-actions">
              <a class="btn btn-outline btn-sm" href="/product/?id=${bundle.id}">View complete set</a>
              <button class="btn btn-primary btn-sm bundle-add" data-id="${bundle.id}" aria-label="${bundle.stock === 0 ? `${bundle.name} is sold out` : `Add ${bundle.name} to cart`}" ${bundle.stock === 0 ? 'disabled' : ''}>${bundle.stock === 0 ? 'Sold out' : 'Add the set'}</button>
            </div>
          </div>
        </div>
      </aside>`).join('');
    const componentMarkup = bundleComponents.length ? `
      <section class="pd-bundle-components" aria-labelledby="bundleContentsHeading">
        <h3 id="bundleContentsHeading">In the set</h3>
        <p>Matched to the system in the photograph.</p>
        <ul>${bundleComponents.map(item => `<li><span>${item.quantity} x</span><a href="/product/?id=${item.product.id}">${item.product.name}</a></li>`).join('')}</ul>
      </section>` : '';
    /* Configuration: stage build and faucet. Prices shown here are a preview;
       the order API recomputes every figure from the database before charging. */
    const stageOptions = Array.isArray(p.stageOptions) ? p.stageOptions : [];
    const faucetUpgrades = p.productKind === 'system'
      ? Store.getProducts().filter(item => item.productKind === 'faucet' && item.availableAsUpgrade && item.stock !== 0)
      : [];
    const defaultFaucet = p.defaultFaucetId ? Store.getProduct(p.defaultFaucetId) : null;

    const stageMarkup = stageOptions.length ? `
      <div class="pd-config" role="group" aria-labelledby="stageLabel">
        <h4 id="stageLabel">Choose your filtration build</h4>
        <div class="config-options">
          ${stageOptions.map(option => `
            <label class="config-option">
              <input type="radio" name="stageOption" value="${escapeHTML(option.id)}"
                data-price="${option.price}" ${option.isDefault || stageOptions.length === 1 ? 'checked' : ''}>
              <span class="config-body">
                <strong>${escapeHTML(option.label)}</strong>
                ${option.description ? `<small>${escapeHTML(option.description)}</small>` : ''}
              </span>
              <span class="config-price">${money(option.price)}</span>
            </label>`).join('')}
        </div>
      </div>` : '';

    const faucetMarkup = faucetUpgrades.length ? `
      <div class="pd-config" role="group" aria-labelledby="faucetLabel">
        <h4 id="faucetLabel">Faucet</h4>
        <div class="config-options">
          <label class="config-option">
            <input type="radio" name="faucetOption" value="" data-add="0" checked>
            <span class="config-body">
              <strong>${defaultFaucet ? escapeHTML(defaultFaucet.name) : 'Included faucet'}</strong>
              <small>Included with this system</small>
            </span>
            <span class="config-price">Included</span>
          </label>
          ${faucetUpgrades.map(faucet => `
            <label class="config-option">
              <input type="radio" name="faucetOption" value="${escapeHTML(faucet.id)}" data-add="${faucet.price}">
              <span class="config-body">
                <strong>${escapeHTML(faucet.name)}</strong>
                ${faucet.short ? `<small>${escapeHTML(faucet.short)}</small>` : ''}
              </span>
              <span class="config-price">+${money(faucet.price)}</span>
            </label>`).join('')}
        </div>
      </div>` : '';

    const configuratorMarkup = stageMarkup + faucetMarkup;

    const stockCls = p.stock === 0 ? 'out' : p.stock <= 15 ? 'low' : 'in';
    const stockIc = p.stock === 0 ? 'close' : 'check';
    const stockTxt = p.stock === 0 ? 'Sold out' : p.stock <= 15 ? `${p.stock} in stock, ships in 1 to 2 business days` : 'In stock, ships in 1 to 2 business days';
    const stockMsg = `<span class="ic" style="width:1.1em;height:1.1em">${svgIcon(stockIc)}</span> ${stockTxt}`;
    /* The product explained: each accordion is built only from what the
       catalogue actually says about this product, so nothing is invented. */
    const compatible = p.productKind === 'system' ? Store.getCompatibleFilters(p.id) : [];
    const minutes = Number(p.installationMinutes) || 0;
    const fitsText = p.productKind === 'system'
      ? [p.category === 'Countertop' ? 'Sits on the counter and connects to the tap, with no change to the plumbing, so it leaves with you when you move.' : p.category === 'Whole House' ? 'Fits at the point where water enters the home and treats every tap.' : 'Fits under a standard kitchen sink and feeds its own faucet.',
         minutes ? `Most people fit it in about ${minutes} minutes with household tools, or our own team fits it for you.` : 'Our own team fits it for you on request.'].join(' ')
      : (p.productKind === 'filter_bundle' ? 'A matched set for one system, listed below.' : (p.compatibleSystemIds || []).length ? 'Fits the systems listed under replacement filters on their pages.' : '');
    const removes = p.category === 'Reverse Osmosis' && p.productKind === 'system' ? [['Lead', 99], ['Chlorine and taste', 98], ['PFAS', 97], ['Microplastics', 99], ['Rust and sediment', 99], ['Fluoride', 95]] : [];
    const details = [
      removes.length ? ['What it removes', `${removes.map(([k, v]) => `<div class="bar-row"><span>${k}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><span class="bar-val">${v}%</span></div>`).join('')}<p class="chart-note">Typical reduction for a Crystalina reverse osmosis system under laboratory conditions. Rates vary with water pressure, temperature and a building's plumbing.</p>`] : null,
      fitsText ? ['What it fits', `<p>${escapeHTML(fitsText)}</p>`] : null,
      (p.specs || []).length ? ['Specifications', `<ul>${p.specs.map(x => `<li>${escapeHTML(x)}</li>`).join('')}</ul>`] : null,
      compatible.length ? ['Replacement filters', `<ul class="pd-filters">${compatible.map(c => `<li><a href="/product/?id=${encodeURIComponent(c.product.id)}">${escapeHTML(c.product.name)}</a><small>${c.replacementIntervalDays ? 'every ' + Math.round(c.replacementIntervalDays / 30) + ' months' : ''}</small></li>`).join('')}</ul><p>When a filter is due we say so, and the replacement arrives at your door.</p>`] : null,
      ['Delivery and returns', '<p>Free delivery in the five boroughs on orders over <span data-ship-threshold>$99</span>, in 1 to 2 business days. Sixty days to return it, and a one-year warranty.</p>'],
    ].filter(Boolean);

    layout.innerHTML = `
      <div class="pd-media"><img src="${p.image}" alt="${escapeHTML(p.name)}"></div>
      <div class="pd-buy">
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a><span>/</span><a href="/shop/">Shop</a><span>/</span><a href="/shop/?cat=${encodeURIComponent(p.category)}">${escapeHTML(p.category)}</a></nav>
        <h1 class="pd-name">${escapeHTML(p.name)}</h1>
        ${p.reviews ? `<div class="pd-rating">★ ${p.rating} <span>· ${p.reviews} reviews</span></div>` : ''}
        <div class="pd-prices">
          <span class="pd-price" id="pdPrice">${money(p.price)}</span>
          ${p.comparePrice ? `<span class="pd-compare">${money(p.comparePrice)}</span>` : ''}
        </div>
        <div class="pd-rule" aria-hidden="true"></div>
        <p class="pd-line">${escapeHTML(p.short || '')}</p>
        ${configuratorMarkup}
        <div class="pd-qtyrow">
          <div class="qty-picker">
            <button id="qDec" aria-label="Decrease quantity">−</button><span id="qVal" aria-live="polite">1</span><button id="qInc" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn btn-primary" style="flex:1" id="addBtn" ${p.stock === 0 ? 'disabled' : ''}>
            ${p.stock === 0 ? 'Sold out' : 'Add to Cart'}
          </button>
        </div>
        <div class="pd-stock ${stockCls}">${stockMsg}</div>
        <a href="https://wa.me/19178094803?text=${encodeURIComponent('Hi, I have a question about the ' + p.name)}" target="_blank" rel="noopener" class="text-link pd-ask">Ask us about this system</a>
        <ul class="pd-facts">
          <li>${icon('truck')} Free delivery in the five boroughs over <span data-ship-threshold>$99</span></li>
          <li>${icon('wrench')} Fitted by our own team, on request</li>
          <li>${icon('returns')} Sixty-day returns and a one-year warranty</li>
        </ul>
        <div class="pd-details">
          ${details.map(([title, body], i) => `<details class="faq-item" ${i === 0 ? 'open' : ''}><summary>${title}</summary><div class="faq-a">${body}</div></details>`).join('')}
        </div>
        ${completeSetMarkup}
        ${componentMarkup}
      </div>`;

    let qty = 1;
    const qVal = document.getElementById('qVal');
    document.getElementById('qInc').addEventListener('click', () => { qty = Math.min(qty + 1, Math.max(p.stock, 1)); qVal.textContent = qty; });
    document.getElementById('qDec').addEventListener('click', () => { qty = Math.max(1, qty - 1); qVal.textContent = qty; });
    const addBtn = document.getElementById('addBtn');
    /* Keep the headline price in step with the chosen configuration. */
    const priceEl = document.getElementById('pdPrice');
    const selectedStage = () => layout.querySelector('input[name="stageOption"]:checked');
    const selectedFaucet = () => layout.querySelector('input[name="faucetOption"]:checked');
    function configuredPrice() {
      const stage = selectedStage();
      const faucet = selectedFaucet();
      const base = stage ? Number(stage.dataset.price) : p.price;
      return base + (faucet ? Number(faucet.dataset.add || 0) : 0);
    }
    function refreshPrice() { if (priceEl) priceEl.textContent = money(configuredPrice()); }
    layout.querySelectorAll('input[name="stageOption"], input[name="faucetOption"]')
      .forEach(input => input.addEventListener('change', refreshPrice));
    refreshPrice();

    if (p.stock > 0) addBtn.addEventListener('click', () => {
      const stage = selectedStage();
      const faucet = selectedFaucet();
      Store.addToCart(p.id, qty, {
        stageOptionId: stage ? stage.value : null,
        faucetId: faucet && faucet.value ? faucet.value : null
      });
      toast('Added to cart');
      openCart();
    });
    document.querySelectorAll('.bundle-add:not([disabled])').forEach(button => button.addEventListener('click', () => {
      Store.addToCart(button.dataset.id);
      toast('Complete set added to cart');
      openCart();
    }));

    const related = Store.getProducts().filter(x => x.id !== p.id && x.category === p.category);
    const fill = Store.getProducts().filter(x => x.id !== p.id && x.category !== p.category);
    if (typeof applyShippingThreshold === 'function') applyShippingThreshold();
    document.getElementById('relatedHeading').textContent = related.length ? 'Also in ' + p.category : 'Also from Crystalina';
    document.getElementById('relatedGrid').innerHTML = [...related, ...fill].slice(0, 4).map(productCard).join('');
    bindAddButtons();
  }
</script>
</body>
</html>
