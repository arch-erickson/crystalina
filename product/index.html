<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Crystalina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>

<main>
  <section class="section" id="pdSection">
    <div class="container pd-layout" id="pdLayout"></div>
  </section>

  <section class="section section-alt">
    <div class="container">
      <div class="section-head">
        <span class="eyebrow">Keep Exploring</span>
        <h2>You Might Also Like</h2>
      </div>
      <div class="product-grid" id="relatedGrid"></div>
    </div>
  </section>
</main>

<script src="/js/store.js"></script>
<script src="/js/main.js"></script>
<script>
  initPage('/shop/');

  const id = new URLSearchParams(location.search).get('id');
  const p = Store.getProduct(id);
  const layout = document.getElementById('pdLayout');

  if (!p) {
    layout.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:60px 0;">
      <h1>Product not found</h1>
      <p style="color:var(--muted); margin:12px 0 24px;">It may have been removed from the catalog.</p>
      <a class="btn btn-primary" href="/shop/">Back to Shop</a></div>`;
  } else {
    document.title = p.name + ' | Crystalina';
    const stockCls = p.stock === 0 ? 'out' : p.stock <= 15 ? 'low' : 'in';
    const stockIc = p.stock === 0 ? 'close' : p.stock <= 15 ? 'alert' : 'check';
    const stockTxt = p.stock === 0 ? 'Out of stock' : p.stock <= 15 ? `Low stock, only ${p.stock} left` : 'In stock, ships in 1 to 2 business days';
    const stockMsg = `<span class="ic" style="width:1.1em;height:1.1em">${svgIcon(stockIc)}</span> ${stockTxt}`;
    layout.innerHTML = `
      <div class="pd-img"><img src="${p.image}" alt="${p.name}"></div>
      <div>
        <span class="pd-cat">${p.category}</span>
        <h1 class="pd-name">${p.name}</h1>
        <div class="pd-rating">★ ${p.rating} <span>· ${p.reviews} reviews</span></div>
        <div class="pd-prices">
          <span class="pd-price">${money(p.price)}</span>
          ${p.comparePrice ? `<span class="pd-compare">${money(p.comparePrice)}</span>` : ''}
        </div>
        <div class="pd-stock ${stockCls}">${stockMsg}</div>
        <p class="pd-desc">${p.description}</p>
        <div class="pd-specs">
          <h4>Key Features</h4>
          <ul class="checklist">${(p.specs || []).map(s => `<li>${s}</li>`).join('')}</ul>
        </div>
        <div class="pd-qtyrow">
          <div class="qty-picker">
            <button id="qDec">−</button><span id="qVal">1</span><button id="qInc">+</button>
          </div>
          <button class="btn btn-primary" style="flex:1" id="addBtn" ${p.stock === 0 ? 'disabled' : ''}>
            ${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
          </button>
        </div>
        <a href="https://wa.me/19178094803?text=${encodeURIComponent('Hi! I have a question about the ' + p.name)}" target="_blank" rel="noopener" class="btn btn-outline btn-block">${svgIcon('chat')} Ask us about this product on WhatsApp</a>
        <div class="pd-perks">
          <span class="pd-perk">${icon('truck')} Free five-borough delivery on orders over $99</span>
          <span class="pd-perk">${icon('wrench')} Professional NYC installation available at checkout</span>
          <span class="pd-perk">${icon('returns')} 60-day returns and 1-year warranty</span>
        </div>
      </div>`;

    let qty = 1;
    const qVal = document.getElementById('qVal');
    document.getElementById('qInc').addEventListener('click', () => { qty = Math.min(qty + 1, Math.max(p.stock, 1)); qVal.textContent = qty; });
    document.getElementById('qDec').addEventListener('click', () => { qty = Math.max(1, qty - 1); qVal.textContent = qty; });
    const addBtn = document.getElementById('addBtn');
    if (p.stock > 0) addBtn.addEventListener('click', () => { Store.addToCart(p.id, qty); toast('Added to cart'); openCart(); });

    const related = Store.getProducts().filter(x => x.id !== p.id && x.category === p.category);
    const fill = Store.getProducts().filter(x => x.id !== p.id && x.category !== p.category);
    document.getElementById('relatedGrid').innerHTML = [...related, ...fill].slice(0, 4).map(productCard).join('');
    bindAddButtons();
  }
</script>
</body>
</html>
