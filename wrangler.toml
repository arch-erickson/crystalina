# Cloudflare Pages, for crystalina.org.
#
# Serving and the server boundary in one project (AD1). The static site is
# dist/, assembled by `npm run build:site` from an explicit allow-list, and
# the three routes under functions/ run as Pages Functions (AD2).
#
# Secrets are NOT here and never will be. They are set by the owner in the
# Pages dashboard, per environment. The names are listed in section 9 of
# docs/blueprint.html and in .env.example.

name = "crystalina"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# nodejs_compat gives the functions Buffer and node:crypto. api/contact.mjs
# hashes with node:crypto, and functions/_shim.js builds the request body
# with Buffer. Without this flag both fail at runtime, not at deploy.
compatibility_flags = ["nodejs_compat"]

# No [env.*] blocks here on purpose. They held nothing but comments, and
# their presence made wrangler warn that multiple environments were defined
# with no target chosen, then auto-fill a deploy command of `wrangler deploy`
# that is wrong for Pages. The Pages project needs no deploy command at all:
# it uploads pages_build_output_dir itself.
#
# Variables are set per environment in the Pages dashboard, under Settings,
# Variables and secrets. Preview gets its own values so a test on a branch
# cannot mail a real customer or move real stock (U4).
#
# Plain values:  SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, PUBLIC_SITE_URL,
#                TURNSTILE_SITE_KEY, EMAIL_FROM, CONTACT_INBOX
# Secrets:       SUPABASE_SERVICE_ROLE_KEY, TURNSTILE_SECRET_KEY,
#                RESEND_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
