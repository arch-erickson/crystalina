# Cloudflare Worker, serving crystalina.org.
#
# Cloudflare folded Pages into Workers: new projects are created through the
# Workers flow, deploy with `wrangler deploy`, and their build token carries
# Workers permissions rather than Pages ones. A Pages-shaped config made
# every deploy fail on the Pages API with an authentication error, so this
# is a Worker with static assets instead (AD10).
#
# worker.js routes /api/* to the handlers and hands everything else to the
# ASSETS binding. The files under functions/ still work unchanged if the
# Pages flow ever comes back.
#
# Secrets are NOT here and never will be. They are set by the owner in the
# dashboard under Settings, Variables and secrets, per environment. The
# names are in section 9 of the blueprint and in .env.example.
#
# Plain values:  SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, PUBLIC_SITE_URL,
#                TURNSTILE_SITE_KEY, EMAIL_FROM, CONTACT_INBOX
# Secrets:       SUPABASE_SERVICE_ROLE_KEY, TURNSTILE_SECRET_KEY,
#                RESEND_API_KEY, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET

name = "crystalina"
main = "worker.js"
compatibility_date = "2026-09-01"

# Buffer and node:crypto. api/contact.mjs hashes with node:crypto and the
# shim builds the request body with Buffer. Without this both fail at
# runtime rather than at deploy.
compatibility_flags = ["nodejs_compat"]

# npm run build:site assembles dist/ from an explicit allow-list, so only
# what belongs on the site is published (AD7).
[assets]
directory = "./dist"
binding = "ASSETS"
# A clean URL like /shop/ serves /shop/index.html. An unknown path serves
# 404.html with a 404 status, never the home page: a dead link should say
# so. 404.html is in the publish list in scripts/build-site.mjs.
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
